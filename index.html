.form input:focus{border-color:var(--bronze)}
.feed{display:flex;flex-direction:column;gap:8px}

  .pl-s{font-size:12px;white-space:normal}
  .pad{transform:scale(.82);transform-origin:right bottom;right:14px;bottom:14px}
  .cross{bottom:auto;top:130px}

    h+=`<circle data-i="${p.i}" cx="${mx(ox)}" cy="${mz(oz)}" r="5.5" fill="#fff" opacity=".85"><title>${p.name}</title></circle>`}

function travelTo(p){ // fly over the roofs to a place on any street

let hudKey='';

function updateHud(m){
  const S=S0();let best=null,bd=1e9;PLACES.forEach(p=>{if(p.st!==S.i)return;const a=(p.u-nav.u)*nav.head;if(a<-5||a>STOP+9)return;const d=Math.abs(a-STOP);if(d<bd){bd=d;best=p}});
  const p=cur||best;
  lookBias=(best&&mode==='walk')?-best.s*nav.head*(PORTRAIT?.45:.1)*clamp(1-Math.abs((best.u-nav.u)*nav.head-STOP)/10,0,1):0;
  const st=p?openState(p,m):null;
  let status;
  if(!p)status=`<i></i>${openNow(m)} · ${MOBILE?'кнопки — идти':'листай или жми стрелки'}`;
  else if(p.k==='ad')status='<i></i>свободно · нажми, чтобы узнать условия';
  else if(p.k==='lease')status=`<i class="deal"></i>${p.line}`;
  else if(st.open)status=`<i></i>${p.hours?'открыто до '+st.closes:'24/7'} · ${p.agent.toLowerCase()}`;
  else status=`<i class="off"></i>закрыто до ${st.opens} · агент примет предзаказ`;
  const key=p?p.i:'s'+S.i;
  if(key!==hudKey){
    hudKey=key;const box=$('#place');box.classList.add('out');
    setTimeout(()=>{
      $('#plN').innerHTML=`<span>${p?`${String(p.i+1).padStart(2,'0')} / ${String(PLACES.length).padStart(2,'0')} · ${STREETS[p.st].short} · ${p.k==='lease'?'недвижимость':p.line}`:'Бишкек · etb.world'}</span>`;
      const nm=p?p.name:S.name;$('#plT').innerHTML=split(nm);$('#plT').classList.toggle('long',nm.length>10);$('#plS').innerHTML=status;
      requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.remove('out')));
    },420);
  }else if(!$('#place').classList.contains('out'))$('#plS').innerHTML=status;
  // intersection hint
  let ahead=null;for(const it of S.ints){const d=(it.u-nav.u)*nav.head;if(d>-4&&d<22&&(!ahead||d<ahead.d))ahead={...it,d}}
  const cr=$('#cross');
  if(ahead&&mode==='walk'){cr.textContent=`перекрёсток · ${STREETS[ahead.other].short} ← →`;cr.classList.add('on');$('#kL').classList.add('hint');$('#kR').classList.add('hint')}
  else{cr.classList.remove('on');$('#kL').classList.remove('hint');$('#kR').classList.remove('hint')}
  paintMap(m);
}

  const step_=t=>{const k=(t-start)/dur;if(k>=1){lapse=null;simOffset=0;return}simOffset=k*86400000;lapse.raf=requestAnimationFrame(step_)};
  lapse.raf=requestAnimationFrame(step_);
};
$('#wx').onclick=()=>{wx={...wx,kind:ORDER[(ORDER.indexOf(wx.kind)+1)%ORDER.length],real:false}};

/* ================= boot ================= */
await Promise.race([Promise.all([document.fonts.load('600 80px Unbounded','KAZAN ПЕРЕГОВОРНАЯ СУПАРА ТАЛКАН ЛУНА КОФЕ РЕКЛАМНОЕ МЕСТО ЭКРАН СДАЁТСЯ ПРОДАЁТСЯ'),document.fonts.load('500 30px Onest','ул. Ала-Тоо Иссык-Куль пр. etb ваш ролик щит экран м² аренда продажа')]),sleep(2500)]);
STREETS.forEach(buildStreet);
PLACES.forEach(p=>p.k==='ad'?billboard(p):shopBuilding(p));
STREETS.forEach(finishLedges);
scene.updateMatrixWorld(true);
PLACES.forEach(p=>{const r=shopRT[p.i];if(r)r.lightWorld.copy(r.lightLocal).applyMatrix4(STREETS[p.st].g.matrixWorld)});
buildMap();
await Promise.race([loadWeather(),sleep(2500)]);setInterval(loadWeather,10*60*1000);
window.__w={get mode(){return mode},nav,cam,PLACES,STREETS,focusPlace,goInside,toWalk,toFocus,step,turn,travelTo,setWx:k=>wx={...wx,kind:k,real:false},setT:h=>simOffset=h,get wx(){return wx},
  skipIntro:()=>{tween=null;const [x,z]=streetPt(0,nav.u);Object.assign(cam,{x,y:1.72,z,yaw:0,pitch:0,fov:56});mode='walk'}};

applyEnvironment(minutesNow(),10);refreshEnv();
let last=performance.now(),frame=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;frame++;
  const m=minutesNow();
  const P=applyEnvironment(m,dt);
  if(!stepTween(t)){
    if(mode==='walk'){
      follow(nav,'u','vu','au',nav.tu,dt,2.4,drag?9:5.2);
      if(nav.pending&&Math.abs(nav.u-nav.pending.it.u)<.25&&Math.abs(nav.vu)<.5){const pd=nav.pending;nav.pending=null;doTurn(pd.it,pd.side)}
      const [x,z]=streetPt(nav.st,nav.u);cam.x=x;cam.z=z;
      sd(cam,'y',1.72,vel,'y',.6,dt);
      lookBiasS=lerp(lookBiasS,lookBias,1-Math.exp(-dt*1.4));
      if(!yawF.init){yawF.y=cam.yaw;yawF.v=0;yawF.a=0;yawF.init=true}
      follow(yawF,'y','v','a',angleTo(yawF.y,streetYaw(nav.st,nav.head)+lookBiasS),dt,2.2,1.5);
      cam.yaw=yawF.y;vel.yaw=yawF.v*.35;
      sd(cam,'pitch',0,vel,'pitch',.5,dt);
      cam.fov=lerp(cam.fov,56,1-Math.exp(-dt*2));
    }else{yawF.init=false;}
    if(mode==='inside'){
      sd(cam,'yaw',angleTo(cam.yaw,tgt.yaw),vel,'yaw',.35,dt);sd(cam,'pitch',tgt.pitch,vel,'pitch',.35,dt);cam.fov=lerp(cam.fov,66,.04);
    }
    grade.uniforms.amount.value=lerp(grade.uniforms.amount.value,.35,.05);
  }
  lookS.x=lerp(lookS.x,mode==='walk'&&!drag&&!tween&&!MOBILE?look.x:0,.04);lookS.y=lerp(lookS.y,mode==='walk'&&!drag&&!tween&&!MOBILE?look.y:0,.04);
  const speed=Math.abs(nav.vu);
  bobPh+=speed*dt*2.3;const bob=mode==='walk'?Math.sin(bobPh)*Math.min(.03,speed*.008):0;
  camera.position.set(cam.x,cam.y+bob,cam.z);
  camera.rotation.set(cam.pitch-lookS.y*.08,cam.yaw-lookS.x*.2,mode==='walk'?-vel.yaw*.02:0);
  if(Math.abs(camera.fov-cam.fov)>.01){camera.fov=cam.fov;camera.updateProjectionMatrix()}
  PLACES.forEach(p=>{const r=shopRT[p.i];if(r&&!r.lease)r.glassMat.opacity=(mode==='inside'&&cur===p)?0:.2*(1-P.d*.5)});
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  clouds.forEach(c=>{c.userData.a+=c.userData.v*dt*1000;c.position.set(camera.position.x+Math.cos(c.userData.a)*c.userData.r,c.userData.y,camera.position.z+Math.sin(c.userData.a)*c.userData.r)});
  mtns.position.set(camera.position.x*.85,0,camera.position.z*.85);
  cars.forEach(c=>{const u=c.userData;c.position.z-=u.dir*u.v*dt;if(c.position.z<-u.len-30)c.position.z=30;if(c.position.z>30)c.position.z=-u.len-30});
  updatePrecip(dt,t);
  if(frame%3===0)drawScreen(t);
  grade.uniforms.time.value=(t%10000)/1000;
  $('#clkTx').textContent=hhmm(m)+(lapse?' · сутки за минуту':'');$('#clk').classList.toggle('lapse',!!lapse);
  $('#wxIc').textContent=WX[wx.kind][P.d>.5?2:1];
  $('#wxTx').textContent=`Бишкек${wx.temp!=null?' · '+(wx.temp>0?'+':'')+wx.temp+'°':''} · ${WX[wx.kind][0]}`;
  const me=document.getElementById('me');if(me)me.setAttribute('transform',`translate(${mx(camera.position.x)},${mz(camera.position.z)}) rotate(${-cam.yaw*180/Math.PI})`);
  if(frame%6===0&&mode!=='intro')updateHud(m);
  composer.render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(()=>{$('#loading').classList.add('off');const [x,z]=streetPt(0,-2);tweenTo({x,y:1.72,z,yaw:0,pitch:0,fov:56},4800,{arc:0,done:()=>{mode='walk';updateHud(minutesNow())}});document.body.classList.add('ready')},400);
