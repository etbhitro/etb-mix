<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0c0e">
<title>etb.world</title>
<meta name="description" content="Компании Бишкека в одном свайпе. В каждой работает агент.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e;--ink:#1f1a15;--mute:#8a7e70;--bronze:#a47148;--paper:#f7f2ea;--paper2:#efe8dc;--line:rgba(31,26,21,.1);
  --ok:#7fe0a8;--off:#ffb4a2;--cw:min(440px,calc(100vw - 48px));--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font:400 16px/1.45 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;display:flex;flex-direction:column;height:100dvh}
button,input{font:inherit;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
img{display:block}

/* ambient backdrop: the active company's photo, blurred */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg img{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(70px) saturate(1.25);opacity:0;transition:opacity 1.2s ease}
#bg img.on{opacity:.5}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 30%,rgba(12,12,14,.85))}

/* top bar */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:16px;padding:16px 20px 10px;padding-top:max(16px,env(safe-area-inset-top))}
.logo{font:700 19px Unbounded,sans-serif;letter-spacing:-.04em;color:#fff;text-decoration:none;white-space:nowrap}
.logo i{font-style:normal;color:#ffb86b}
.cats{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:7px 14px;border-radius:99px;font-size:14px;color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.14);transition:.3s}
.cats button:hover{color:#fff}
.cats button.on{background:#fff;color:#111;border-color:#fff}
.chips{display:flex;gap:6px;flex:none}
.chip{padding:7px 12px;border-radius:99px;font-size:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip small{color:rgba(255,255,255,.55);font-size:inherit}

/* carousel */
.stage{position:relative;z-index:2;flex:1;min-height:0;display:flex}
#track{flex:1;display:flex;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px calc((100vw - var(--cw))/2) 8px;align-items:stretch;touch-action:pan-x}
#track::-webkit-scrollbar{display:none}
.card{flex:0 0 var(--cw);scroll-snap-align:center;scroll-snap-stop:always;position:relative;opacity:0;transform:translateY(30px);animation:rise .9s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.ci{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:#1a1a1d;transform:scale(calc(1 - var(--d,0)*.07));opacity:calc(1 - var(--d,0)*.5);transition:transform .25s ease-out,opacity .25s ease-out;cursor:pointer;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.ci>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 8s ease-out,opacity .8s;opacity:0}
.ci>img.ld{opacity:1}
.card.act .ci>img{transform:scale(1)}
.ci .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 22%,transparent 42%,rgba(0,0,0,.82) 100%)}
.ctop{position:absolute;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:13px;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.st.off i{background:var(--off);box-shadow:none}
.st.deal i{background:#ffd27a;box-shadow:0 0 10px #ffd27a}
.cbot{position:absolute;left:0;right:0;bottom:0;padding:22px}
.thumbs{display:flex;gap:6px;margin-bottom:14px}
.thumbs button{width:52px;height:52px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.3);flex:none}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs span{display:flex;align-items:center;font-size:12px;color:rgba(255,255,255,.7);padding-left:4px;line-height:1.25}
.card h2{font:600 clamp(30px,7.4vw,40px)/1 Unbounded,sans-serif;letter-spacing:-.035em;text-transform:uppercase;text-wrap:balance}
.card h2.long{font-size:clamp(24px,6vw,31px)}
.card .ln{color:rgba(255,255,255,.78);margin-top:8px;font-size:15px}
.ag{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:rgba(255,255,255,.65)}
.ag i{width:6px;height:6px;border-radius:50%;background:#ffb86b;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:99px;font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,background .3s}
.btn:active{transform:scale(.97)}
.btn.ghost{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.ghost:hover{background:rgba(255,255,255,.16)}
.btn.solid{background:#fff;color:#111}
.join .ci{background:linear-gradient(160deg,#2a2622,#14110f)}
.join .ci>img{opacity:.35!important}

/* pager */
.pager{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 20px 18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;transition:.3s}
.arrow:hover{background:#fff;color:#111}
.arrow:disabled{opacity:.25;pointer-events:none}
.count{font:500 13px Onest;color:rgba(255,255,255,.6);min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.count b{color:#fff;font-weight:500}
.bar{height:2px;background:rgba(255,255,255,.14);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .5s var(--ease)}

/* detail sheet */
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;visibility:hidden;color:var(--ink)}
#sheet.on{visibility:visible}
#sheet .scrim{position:absolute;inset:0;background:rgba(8,8,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .5s}
#sheet.on .scrim{opacity:1}
.box{position:relative;width:min(1160px,calc(100vw - 48px));height:min(740px,calc(100dvh - 48px));background:var(--paper);border-radius:30px;overflow:hidden;display:grid;grid-template-columns:1.12fr 1fr;transform:translateY(40px) scale(.97);opacity:0;transition:transform .6s var(--ease),opacity .4s}
#sheet.on .box{transform:none;opacity:1}
.gal{position:relative;background:#111;min-height:0}
.gtrack{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gtrack::-webkit-scrollbar{display:none}
.gtrack figure{flex:0 0 100%;scroll-snap-align:center;position:relative}
.gtrack img{width:100%;height:100%;object-fit:cover}
.gcap{position:absolute;left:18px;bottom:18px;color:#fff;font-size:13px;display:flex;gap:6px;align-items:center}
.gdots{position:absolute;right:18px;bottom:22px;display:flex;gap:5px}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:.4s}
.gdots i.on{width:20px;background:#fff}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.gnav.l{left:16px}.gnav.r{right:16px}
.x{position:absolute;right:16px;top:16px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.info{display:flex;flex-direction:column;min-height:0;padding:30px 34px 26px}
.kick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.kick i{width:7px;height:7px;border-radius:50%;background:#2fa866}
.kick.off i{background:#d0674f}.kick.deal i{background:#d6a23a}
.info h3{font:600 clamp(26px,3vw,36px)/1.05 Unbounded,sans-serif;letter-spacing:-.035em;text-transform:uppercase;margin-top:10px}
.info .sub{color:var(--mute);margin-top:6px;font-size:15px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:20px;flex:none}
.tabs button{padding:0 0 11px;font-size:15px;color:var(--mute);position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.pane{flex:1;min-height:0;overflow:auto;padding-top:16px;scrollbar-width:thin}
.foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--line);margin-top:8px}
.foot[hidden]{display:none}
.foot .tot{flex:1;font:500 18px Onest;font-variant-numeric:tabular-nums}
.foot .tot small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.pill{height:48px;padding:0 24px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:15px;transition:.25s}
.pill.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill:disabled{opacity:.35;pointer-events:none}
.seg{display:inline-flex;background:var(--paper2);border-radius:99px;padding:4px;margin-bottom:12px}
.seg button{padding:7px 16px;border-radius:99px;font-size:14px;color:var(--mute);transition:.25s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.it{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it>div:first-child{flex:1;min-width:0}
.it b{font-weight:500;display:block}
.it small{color:var(--mute);font-size:13px}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:17px;line-height:1}
.qty button:hover{background:#fff}
.qty span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.it.pick{cursor:pointer;border-radius:14px;padding:13px 14px;border:1px solid var(--line);margin-bottom:8px;transition:.25s}
.it.pick:hover{background:#fff}
.it.pick.on{border-color:var(--ink);background:#fff}
.it.pick .ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px}
.it.pick.on .ck{background:var(--ink);color:#fff;border-color:var(--ink)}
.about p{font-size:16px;line-height:1.6;color:#3a332c;max-width:46ch}
.facts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--paper2);border-radius:16px;padding:12px 14px}
.facts span{display:block;font-size:12px;color:var(--mute)}
.facts b{font-weight:500;font-size:15px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.specs div{background:var(--paper2);border-radius:16px;padding:14px}
.specs b{font:600 22px Unbounded,sans-serif;letter-spacing:-.03em;display:block}
.specs span{font-size:13px;color:var(--mute)}
.form{display:flex;gap:8px;flex-wrap:wrap}
.form input{flex:1;min-width:180px;height:48px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:0 20px;color:var(--ink);outline:none}
.form input:focus{border-color:var(--ink)}
/* agent chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.back{font-size:14px;color:var(--mute);margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 12px Unbounded}
.who small{display:block;color:var(--mute);font-size:12px}
.b{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.b.ai{background:#fff;border-bottom-left-radius:6px;align-self:flex-start}
.b.mine{background:var(--ink);color:var(--paper);border-bottom-right-radius:6px;align-self:flex-end}
.b .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.b .row button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;background:var(--paper)}
.b .row button:hover{background:var(--ink);color:var(--paper)}
.typing{align-self:flex-start;background:#fff;border-radius:18px;padding:13px 16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.feed .it time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

@media (max-width:820px){
  .box{width:100vw;height:100dvh;border-radius:0;grid-template-columns:1fr;grid-template-rows:38dvh 1fr}
  .info{padding:20px 20px max(16px,env(safe-area-inset-bottom))}
  .tabs{margin-top:14px}
  .gnav{display:none}
}
@media (max-width:640px){
  .top{flex-wrap:wrap;gap:10px 12px;padding:12px 16px 6px;padding-top:max(12px,env(safe-area-inset-top))}
  .chips{margin-left:auto}
  .cats{order:3;flex-basis:100%;mask-image:none}
  :root{--cw:calc(100vw - 52px)}
  #track{gap:10px}
  .pager .arrow{display:none}
  .pager{padding-top:6px}
  .ci{border-radius:26px}
  .cbot{padding:18px}
  .thumbs button{width:46px;height:46px}
}
@media (max-height:640px){.thumbs{display:none}.card .ln{margin-top:4px}.ag{margin-top:6px}.acts{margin-top:10px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg"><img alt=""><img alt=""></div>

<header class="top">
  <a class="logo" href="#">etb<i>.</i>world</a>
  <nav class="cats" id="cats"></nav>
  <div class="chips"><button class="chip" id="clk" title="Время в Бишкеке"></button><span class="chip" id="wx"></span></div>
</header>

<main class="stage"><div id="track"></div></main>

<footer class="pager">
  <button class="arrow" id="prev" aria-label="Назад"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3L5 8l5 5"/></svg></button>
  <div class="count"><div id="cnt"></div><div class="bar"><i id="barI"></i></div></div>
  <button class="arrow" id="next" aria-label="Вперёд"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5"/></svg></button>
</footer>

<section id="sheet" aria-hidden="true"><div class="scrim"></div><div class="box" id="box"></div></section>

<script>
/* =====================================================================

   kind    — order (меню/каталог) · book (запись на услугу) · lease · corp · meet · office
   ===================================================================== */

function minutesNow(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+simOffset));
  return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value;
}
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function openState(c,m=minutesNow()){
  if(c.kind==='lease')return {cls:'deal',txt:c.deal==='rent'?'сдаётся':'продаётся'};
  if(c.kind==='join')return {cls:'deal',txt:'свободное место'};
  if(!c.hours)return {open:true,cls:'',txt:'открыто 24/7'};
  const [o,cl]=c.hours,inside=x=>x>=o&&x<cl,open=inside(m)||inside(m+1440);
  return {open,opens:hhmm(o),cls:open?'':'off',txt:open?`открыто до ${hhmm(cl)}`:`закрыто · откроется в ${hhmm(o)}`};
}

function paintClock(){
  $('#clk').innerHTML=`Бишкек <span>${hhmm(minutesNow())}</span>`;
}
let lapse=null;
$('#clk').onclick=()=>{ // demo: 24 hours in 40 seconds — shops open and close
  if(lapse){cancelAnimationFrame(lapse);lapse=null;simOffset=0;refreshStatus();return}
  const t0=performance.now(),step=t=>{const k=(t-t0)/40000;if(k>=1){lapse=null;simOffset=0;refreshStatus();return}simOffset=k*86400000;refreshStatus();lapse=requestAnimationFrame(step)};
  lapse=requestAnimationFrame(step);
};
const WXI=c=>c===0?'☀️':c<=2?'🌤':c===3?'☁️':c===45||c===48?'🌫':(c>=51&&c<=67)||(c>=80&&c<=82)?'🌧':(c>=71&&c<=77)||c===85||c===86?'🌨':c>=95?'⛈':'☁️';
async function loadWeather(){
  try{
    const j=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=42.87&longitude=74.59&current=temperature_2m,weather_code,is_day&timezone=Asia%2FBishkek')).json();
    const t=Math.round(j.current.temperature_2m),c=j.current.weather_code;
    $('#wx').textContent=`${c===0&&!j.current.is_day?'🌙':WXI(c)} ${t>0?'+':''}${t}°`;$('#wx').style.display='';
  }catch(e){$('#wx').style.display='none'}
}

/* ================= carousel ================= */
const track=$('#track');
let list=[],cards=[],idx=0,cat='Все';
function cardHTML(c,i){
  const st=openState(c),cover=c.photos[0][0],long=c.name.length>12;
  const thumbs=c.photos.slice(1,4).map((p,k)=>`<button data-ph="${k+1}" aria-label="${esc(p[1])}"><img src="${img(p[0],200)}" alt="" loading="lazy"></button>`).join('');
  return `<article class="card${c.kind==='join'?' join':''}" data-i="${i}" style="animation-delay:${Math.min(i,3)*.08}s">
    <div class="ci">
      <img src="${img(cover,900)}" srcset="${srcset(cover)}" sizes="(max-width:640px) 92vw, 440px" alt="${esc(c.name)}" ${i>2?'loading="lazy"':''} onload="this.classList.add('ld')">
      <div class="shade"></div>
      <div class="ctop"><span class="tag">${c.kind==='join'?'для бизнеса':c.cat}</span><span class="tag st ${st.cls}" data-st><i></i><span>${st.txt}</span></span></div>
      <div class="cbot">
        ${thumbs?`<div class="thumbs">${thumbs}<span>${c.photos.length>1?'вид изнутри,<br>фото':''}</span></div>`:''}
        <h2 class="${long?'long':''}">${esc(c.name)}</h2>
        <p class="ln">${esc(c.line)}</p>
        <div class="ag"><i></i>${esc(c.agent)}</div>
        <div class="acts"><button class="btn ghost" data-open="about">Подробнее</button><button class="btn solid" data-open="act">${CTA[c.kind](c)}</button></div>
      </div>
    </div>
  </article>`;
}
function build(){
  list=(cat==='Все'?COMPANIES:COMPANIES.filter(c=>c.cat===cat)).concat(JOIN);
  track.innerHTML=list.map(cardHTML).join('');
  cards=[...track.children];
  cards.forEach((el,i)=>el.querySelector('.ci').onclick=e=>{
    if(i!==idx){go(i);return}
    const b=e.target.closest('[data-open],[data-ph]');
    openSheet(list[i],b?.dataset.open==='act'?'act':'about',b?.dataset.ph?+b.dataset.ph:0);
  });
  track.scrollLeft=0;idx=-1;onScroll();
}
function posOf(i){const el=cards[i];return el.offsetLeft-(track.clientWidth-el.offsetWidth)/2}
function go(i,instant){i=Math.max(0,Math.min(cards.length-1,i));track.scrollTo({left:posOf(i),behavior:instant?'instant':'smooth'})}
let raf=0;
function onScroll(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    const mid=track.scrollLeft+track.clientWidth/2,w=cards[0]?.offsetWidth||1;let best=0,bd=1e9;
    cards.forEach((el,i)=>{const c=el.offsetLeft+el.offsetWidth/2,d=Math.abs(c-mid)/w;el.style.setProperty('--d',Math.min(d,1).toFixed(3));if(d<bd){bd=d;best=i}});
    if(best!==idx)setActive(best);
  });
}
function setActive(i){
  idx=i;cards.forEach((el,k)=>el.classList.toggle('act',k===i));
  const c=list[i];
  $('#cnt').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${String(list.length).padStart(2,'0')} · ${esc(c.name)}`;
  $('#barI').style.width=((i+1)/list.length*100)+'%';
  $('#prev').disabled=i===0;$('#next').disabled=i===list.length-1;
  setBg(img(c.photos[0][0],400));
  history.replaceState(null,'',c.kind==='join'||i===0&&cat==='Все'?location.pathname:'#'+c.id);
  // warm the next covers
  [i+1,i+2].forEach(k=>{const n=list[k];if(n){const im=new Image();im.src=img(n.photos[0][0],900)}});
}
let bgFlip=0;
function setBg(src){const [a,b]=document.querySelectorAll('#bg img'),on=bgFlip?a:b,off=bgFlip?b:a;bgFlip^=1;on.onload=()=>{on.classList.add('on');off.classList.remove('on')};on.src=src}
function refreshStatus(){
  paintClock();const m=minutesNow();
  cards.forEach((el,i)=>{const s=openState(list[i],m),t=el.querySelector('[data-st]');t.className='tag st '+s.cls;t.lastElementChild.textContent=s.txt});
}
track.addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>go(idx,true));
$('#prev').onclick=()=>go(idx-1);$('#next').onclick=()=>go(idx+1);
// mouse wheel → one card per gesture
let wheelLock=0;
track.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return; // trackpad sideways: native
  e.preventDefault();const now=performance.now();if(now<wheelLock||Math.abs(e.deltaY)<8)return;
  wheelLock=now+520;go(idx+(e.deltaY>0?1:-1));
},{passive:false});
addEventListener('keydown',e=>{
  if(sheetOn){if(e.key==='Escape')closeSheet();return}
  if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);
  else if(e.key==='Enter')openSheet(list[idx],'about',0);
});
// mouse drag on desktop
let drag=null,noClick=false;
track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button)return;drag={x:e.clientX,s:track.scrollLeft,i:idx,moved:false}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;
  if(!drag.moved&&Math.abs(dx)>6){drag.moved=true;track.style.scrollSnapType='none';track.style.cursor='grabbing'}
  if(drag.moved)track.scrollLeft=drag.s-dx});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved)return;
  const dx=e.clientX-d.x;track.style.scrollSnapType='';track.style.cursor='';noClick=true;setTimeout(()=>noClick=false,50);
  go(idx!==d.i?idx:Math.abs(dx)>60?d.i+(dx<0?1:-1):d.i)});
track.addEventListener('click',e=>{if(noClick){e.stopPropagation();e.preventDefault()}},true);

/* category chips */
$('#cats').innerHTML=CATS.map(c=>`<button class="${c==='Все'?'on':''}">${c}</button>`).join('');
$('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(b.textContent===cat)return;cat=b.textContent;
  $('#cats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  build();
});

/* ================= detail sheet ================= */
const sheet=$('#sheet'),box=$('#box');let sheetOn=false,orderNo=2050;
function closeSheet(){sheetOn=false;sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true')}
sheet.querySelector('.scrim').onclick=closeSheet;
function openSheet(c,tab,ph){
  const st=openState(c),act=TAB[c.kind](c);
  box.innerHTML=`
    <div class="gal">
      <div class="gtrack" id="gt">${c.photos.map(([p,cap])=>`<figure><img src="${img(p,1600)}" alt="${esc(cap)}"></figure>`).join('')}</div>
      <div class="gcap"><span class="tag" id="gcap"></span></div>
      ${c.photos.length>1?`<div class="gdots" id="gd">${c.photos.map(()=>'<i></i>').join('')}</div><button class="gnav l" id="gl" aria-label="Предыдущее фото"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg></button><button class="gnav r" id="gr" aria-label="Следующее фото"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>`:''}
    </div>
    <button class="x" id="sx" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
    <div class="info">
      <div class="kick ${st.cls}"><i></i>${st.txt}${st.open===false?' · агент примет предзаказ':''}</div>
      <h3>${esc(c.name)}</h3><div class="sub">${esc(c.line)}</div>
      <div class="tabs"><button data-t="act">${act}</button><button data-t="about">О компании</button></div>
      <div class="pane" id="pane"></div>
      <div class="foot" id="foot" hidden></div>
    </div>`;
  $('#sx').onclick=closeSheet;
  // gallery
  const gt=$('#gt'),caps=c.photos.map(p=>p[1]);let gi=0;
  const gset=()=>{gi=Math.round(gt.scrollLeft/gt.clientWidth);$('#gcap').textContent=`${caps[gi]} · ${gi+1}/${caps.length}`;document.querySelectorAll('#gd i').forEach((d,k)=>d.classList.toggle('on',k===gi))};
  gt.addEventListener('scroll',()=>requestAnimationFrame(gset),{passive:true});
  const gto=k=>gt.scrollTo({left:((k+caps.length)%caps.length)*gt.clientWidth,behavior:'smooth'});
  $('#gl')&&($('#gl').onclick=()=>gto(gi-1),$('#gr').onclick=()=>gto(gi+1));
  // tabs
  const tabs=box.querySelectorAll('.tabs button');
  const show=t=>{tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#foot').hidden=true;$('#foot').innerHTML='';$('#pane').scrollTop=0;t==='about'?paneAbout(c):PANES[c.kind](c)};
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
  show(tab);
  sheetOn=true;sheet.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>{gt.scrollLeft=ph*gt.clientWidth;gset();sheet.classList.add('on')});
}
function paneAbout(c){
  const st=openState(c),h=c.hours?`${hhmm(c.hours[0])}–${hhmm(c.hours[1])}`:c.kind==='lease'||c.kind==='join'?'—':'круглосуточно';
  const facts=[['Часы работы',h],['Где',c.city],['На связи',c.agent],[c.kind==='book'?'Запись':'Заказ',c.modes?c.modes.join(' · '):c.kind==='book'?'онлайн, 24/7':'через агента']].filter(f=>f[1]&&f[1]!=='—');
  $('#pane').innerHTML=`<div class="about"><p>${esc(c.about)}</p><div class="facts">${facts.map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div></div>`;
  const f=$('#foot');f.hidden=false;f.innerHTML=`<div class="tot"><small>${st.txt}</small></div><button class="pill solid" id="toact">${CTA[c.kind](c)}</button>`;
  $('#toact').onclick=()=>box.querySelector('.tabs [data-t="act"]').click();
}

/* agent chat inside the pane */
function chat(c,backTo){
  const pane=$('#pane');$('#foot').hidden=true;
  pane.innerHTML=`<button class="back" id="cb">← назад</button><div class="who"><div class="av">${esc(c.name.replace(/[«»"]/g,'').trim()[0])}</div><div>${esc(c.name)}<small>${esc(c.agent)}</small></div></div><div class="msgs" id="msgs"></div>`;
  $('#cb').onclick=backTo;
  const msgs=$('#msgs'),down=()=>pane.scrollTo({top:pane.scrollHeight,behavior:'smooth'});
  return {
    me(t){msgs.insertAdjacentHTML('beforeend',`<div class="b mine">${esc(t)}</div>`);down()},
    async ai(t,chips){
      const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';msgs.append(ty);down();
      await sleep(1000);ty.remove();
      msgs.insertAdjacentHTML('beforeend',`<div class="b ai">${t}${chips?`<div class="row">${chips.map(x=>`<button>${esc(x)}</button>`).join('')}</div>`:''}</div>`);down();
      if(!chips)return null;
      const row=msgs.lastElementChild.querySelector('.row');
      return new Promise(r=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{row.remove();this.me(b.textContent);r(b.textContent)}));
    }
  };
}

const PANES={
  order(c){
    const st=openState(c);let md=c.modes[0];
    const items=()=>c.menus?c.menus[md]:c.menu;let q=items().map(()=>0);
    const ql=()=>c.qlabel?.[md]||'';
    const total=()=>items().reduce((s,[,p],i)=>s+(p||0)*q[i],0),count=()=>q.reduce((a,b)=>a+b,0);
    const pane=$('#pane'),foot=$('#foot');
    function render(){
      pane.innerHTML=`${c.modes.length>1?`<div class="seg">${c.modes.map(m=>`<button class="${m===md?'on':''}">${m}</button>`).join('')}</div>`:''}
        <div>${items().map(([n,p],i)=>`<div class="it"><div><b>${esc(n)}</b><small>${p?fmt(p)+' сом':c.free||'цену назовёт продавец'}</small></div><div class="qty"><button data-i="${i}" data-d="-1" aria-label="Меньше">−</button><span>${q[i]}${q[i]&&ql()?' '+ql():''}</span><button data-i="${i}" data-d="1" aria-label="Больше">+</button></div></div>`).join('')}</div>`;
      pane.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{md=b.textContent;q=items().map(()=>0);render()});
      pane.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;q[i]=Math.max(0,q[i]+ +b.dataset.d);renderFoot();b.parentElement.querySelector('span').textContent=q[i]+(q[i]&&ql()?' '+ql():'')});
      renderFoot();
    }
    function renderFoot(){
      foot.hidden=false;
      const lbl=md==='Бронь номера'?'Забронировать':md==='Блюда к заезду'?'Предзаказ':md==='Бронь'?'Забронировать':st.open?'Оформить':'Предзаказ';
      foot.innerHTML=`<div class="tot">${count()?(total()?fmt(total())+' сом':count()+' '+(ql()||'шт')):'—'}<small>${count()?md.toLowerCase():'выберите позиции'}</small></div><button class="pill solid" id="co" ${count()?'':'disabled'}>${lbl}</button>`;
      $('#co').onclick=checkout;
    }
    async function checkout(){
      const no=++orderNo,what=items().map(([n],i)=>q[i]?`${n} × ${q[i]}${ql()?' '+ql():''}`:'').filter(Boolean).join(', ');
      const sum=total()?` — ${fmt(total())} сом`:', цену подтвержу в сообщении';
      const ch=chat(c,()=>{q=items().map(()=>0);render()});ch.me(`${what}, ${md.toLowerCase()}`);
      if(md==='Бронь номера'){
        const d=await ch.ai('Администратор на связи. На какие даты?',['Эти выходные','Следующие выходные','Другие даты']);
        return ch.ai(`Бронь №${no} ✓ ${what}, ${d.toLowerCase()}. Цену и предоплату пришлю в Telegram. Блюда к заезду — во второй вкладке меню.`);
      }
      let r;
      if(md==='Блюда к заезду')r=`Предзаказ №${no} ✓ ${what}. Кухня приготовит к вашему приезду, цену подтвержу в сообщении.`;
      else if(md==='Примерка в магазине')r=`Отложил ✓ ${what}. Вещи ждут вас в примерочной 2 дня, размеры уточню в сообщении.`;
      else if(!st.open)r=`Мы закрыты, но заказ №${no} записал ✓${sum}. Откроемся в ${st.opens} — ваш будет первым.`;
      else if(md==='Доставка'){const a=await ch.ai('Куда доставить?',['Домой','На работу','Другой адрес']);r=`Заказ №${no} принят ✓${sum}. Курьер ${a==='Другой адрес'?'уточнит адрес и ':''}будет примерно через 40 минут, оплата по QR.`}
      else if(md==='Бронь')r=`Бронь №${no} ✓ Столик ждёт вас. Напомню за час.`;
      else r=`Заказ №${no} принят ✓${sum}. Будет готов через 15 минут — назовите номер на кассе.`;
      ch.ai(r);
    }
    render();
  },
  book(c){
    const st=openState(c);let sel=-1;const pane=$('#pane'),foot=$('#foot');
    const render=()=>{
      pane.innerHTML=c.svc.map(([n,d],i)=>`<div class="it pick${i===sel?' on':''}" data-i="${i}"><div><b>${esc(n)}</b><small>${esc(d)}</small></div><span class="ck">${i===sel?'✓':''}</span></div>`).join('');
      pane.querySelectorAll('.pick').forEach(el=>el.onclick=()=>{sel=+el.dataset.i;render()});
      foot.hidden=false;foot.innerHTML=`<div class="tot">${sel<0?'—':esc(c.svc[sel][0])}<small>${sel<0?'выберите услугу':st.open?'запись онлайн':'закрыто, но агент запишет'}</small></div><button class="pill solid" id="co" ${sel<0?'disabled':''}>${c.cta}</button>`;
      $('#co').onclick=async()=>{
        const no=++orderNo,sv=c.svc[sel][0],ch=chat(c,()=>{sel=-1;render()});ch.me(sv);
        const t=await ch.ai(`${c.agent}${st.open?'':' (сейчас закрыто, но запись веду)'}. ${c.ask}`,c.slots);
        ch.ai(c.done.replace('{n}',no).replace('{s}',sv).replace('{t}',t.toLowerCase()));
      };
    };
    render();
  },
  corp(c){
    const st=openState(c),pane=$('#pane'),foot=$('#foot');
    const render=()=>{
      pane.innerHTML=c.dirs.map(([n,d])=>`<div class="it"><div><b>${esc(n)}</b><small>${esc(d)}</small></div></div>`).join('');
      foot.hidden=false;foot.innerHTML=`<div class="tot"><small>${st.txt}</small></div><button class="pill solid" id="co">Записаться на встречу</button>`;
      $('#co').onclick=async()=>{
        const ch=chat(c,render);ch.me('Хочу встречу в офисе');
        const t=await ch.ai(`Координатор на связи${st.open?'':' (офис закрыт, но запись веду)'}. По какому вопросу?`,['Туризм','Патриотический лагерь','Партнёрство']);
        ch.ai(`Записал: ${t.toLowerCase()} ✓ Ближайшее окно — завтра в 11:00. Пришлю точку на карте и напомню за час.`);
      };
    };
    render();
  },
  lease(c){
    const rent=c.deal==='rent',pane=$('#pane'),foot=$('#foot');
    const render=()=>{
      pane.innerHTML=`<div class="specs"><div><b>${c.area} м²</b><span>площадь</span></div><div><b>${c.front} м</b><span>витрина</span></div><div><b>${c.ceil} м</b><span>потолки</span></div><div><b>1</b><span>этаж, вход с улицы</span></div></div>`;
      foot.hidden=false;foot.innerHTML=`<div class="tot">${rent?'Аренда':'Продажа'}<small>цену и условия назовёт агент</small></div><button class="pill solid" id="co">Записаться на показ</button>`;
      $('#co').onclick=async()=>{
        const ch=chat(c,render);ch.me(`Хочу посмотреть ${c.area} м²`);
        const t=await ch.ai('Агент etb.biz на связи. Показ могу провести завтра — какое время удобнее?',['12:00','15:00','18:30']);
        ch.ai(`Записал на завтра, ${t} ✓ Пришлю точку на карте и напомню за час. ${rent?'Условия аренды':'Цену и документы'} покажу на месте.`);
      };
    };
    render();
  },
  meet(c){
    const pane=$('#pane');
    pane.innerHTML=`<p class="sub" style="margin:0 0 14px">Создайте личную ссылку для партнёра. Протоколист подключится к встрече и пришлёт итоги обеим сторонам.</p><form class="form" id="mf"><input id="pn" placeholder="Имя партнёра" autocomplete="off" required><button class="pill solid">Создать ссылку</button></form><div class="msgs" id="mm" style="margin-top:14px"></div>`;
    const slug=s=>{const t={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sh',ы:'y',э:'e',ю:'yu',я:'ya',ү:'u',ө:'o',ң:'n'};return s.toLowerCase().split('').map(ch=>t[ch]??ch).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'partner'};
    $('#mf').onsubmit=async e=>{e.preventDefault();const n=$('#pn').value.trim(),url='etb.world/meet/'+slug(n)+'-'+Math.random().toString(36).slice(2,6);
      navigator.clipboard?.writeText('https://'+url).catch(()=>{});
      $('#mm').insertAdjacentHTML('beforeend',`<div class="b ai">Ссылка для ${esc(n)} готова и скопирована: <b>${url}</b></div>`)};
  },
  async office(c){
    const pane=$('#pane'),m=minutesNow(),rows=[];
    COMPANIES.filter(x=>x.kind==='order'||x.kind==='book').forEach((x,i)=>{const s=openState(x,m);rows.push([`${x.agent} · ${x.name}`,s.open?(x.kind==='book'?`записал клиента №${2040+i}`:`принял заказ №${2040+i}`):`записал предзаказ на ${s.opens}`])});
    rows.push(['Агент etb.biz','записал показ помещения 86 м²'],['Маркетолог','ответил на заявку на размещение'],['Протоколист','итоги встречи отправлены обеим сторонам']);
    pane.innerHTML='<div class="feed" id="fd"></div>';
    for(const [i,[w,t]] of rows.entries()){
      if(!$('#fd'))return;
      $('#fd').insertAdjacentHTML('beforeend',`<div class="it" style="animation:pop .35s var(--ease)"><div><b>${esc(w)}</b><small>${esc(t)}</small></div><time>${hhmm(m-i*3)}</time></div>`);
      await sleep(260);
    }
  },
  join(c){
    const pane=$('#pane');let what='Разместить компанию';
    pane.innerHTML=`<div class="seg"><button class="on">Разместить компанию</button><button>Реклама</button></div>
      <p class="sub" id="jd" style="margin:0 0 14px">Пришлите Instagram — агент соберёт карточку: фото, вид изнутри, меню или услуги.</p>
      <form class="form" id="jf"><input placeholder="Компания или @instagram" required><button class="pill solid">Отправить</button></form><div class="msgs" id="jm" style="margin-top:14px"></div>`;
    pane.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{what=b.textContent;pane.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
      $('#jd').textContent=what==='Реклама'?'Карточка в начале ленты, баннер в категории или спецпроект. Охват и цену пришлёт маркетолог.':'Пришлите Instagram — агент соберёт карточку: фото, вид изнутри, меню или услуги.'});
    $('#jf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
      $('#jm').innerHTML='<div class="typing"><i></i><i></i><i></i></div>';await sleep(1000);
      $('#jm').innerHTML=`<div class="b ai">${what==='Реклама'?'Принято ✓ Маркетолог пришлёт свободные места, охват и цену в Telegram.':'Принято ✓ Соберу карточку из вашего Instagram и пришлю на проверку. Агента-продавца подключим следом.'}</div>`};
  },
};

/* ================= boot ================= */
build();
const h=decodeURIComponent(location.hash.slice(1));
if(h){const i=list.findIndex(c=>c.id===h);if(i>0)requestAnimationFrame(()=>go(i,true))}
refreshStatus();setInterval(()=>{if(!lapse)refreshStatus()},20000);
loadWeather();setInterval(loadWeather,10*60*1000);
// first visit: a small nudge shows the cards move sideways
if(!h)setTimeout(()=>{if(idx===0&&!sheetOn){track.style.scrollSnapType='none';track.scrollTo({left:70,behavior:'smooth'});setTimeout(()=>{track.scrollTo({left:0,behavior:'smooth'});setTimeout(()=>track.style.scrollSnapType='',600)},650)}},1600);
window.__w={go,openSheet:(i,t)=>openSheet(list[i],t||'about',0),closeSheet,get idx(){return idx},list:()=>list};
</script>
