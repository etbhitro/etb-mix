<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<title>etb</title>
<meta name="description" content="etb — миксы, онлайн-тусовки, букинг.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--acc:#ffb86b;--acc2:#b48cff;--mute:rgba(255,255,255,.55);--line:rgba(255,255,255,.12);--glass:rgba(18,18,22,.62);--ease:cubic-bezier(.22,1,.36,1);--pw:410px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font:400 16px/1.45 Onest,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;height:100dvh}
button,input{font:inherit;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
/* the deck: a vinyl that spins with the music */
#deck{--ds:min(74vh,50vw);--dx:66vw;--dy:47vh;position:fixed;z-index:1;width:var(--ds);height:var(--ds);left:var(--dx);top:var(--dy);transform:translate(-50%,-50%);transition:left 1s var(--ease),top 1s var(--ease),width 1s var(--ease),height 1s var(--ease)}
body.pop #deck{--dx:calc((100vw - 430px)*.62)}
.glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,var(--c1,#ffb86b) 0,var(--c2,#b48cff) 30%,transparent 62%);filter:blur(50px);opacity:.18}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 31%,rgba(255,255,255,.05) 31.4%,transparent 32.4%,transparent 47%,rgba(255,255,255,.04) 47.5%,transparent 48.5%,transparent 66%,rgba(255,255,255,.04) 66.4%,transparent 67.4%,transparent 95%,#1d1d21 95.5%,#0b0b0d 97%),repeating-radial-gradient(circle,#0c0c0e 0 2px,#151518 2px 3px);box-shadow:0 50px 120px -30px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.05)}
.label{position:absolute;inset:32%;border-radius:50%;background:var(--lab,#222);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16%;text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.label b{font:700 calc(var(--ds)*.075)/1 Unbounded,sans-serif;letter-spacing:-.05em}
.label span{font-size:calc(var(--ds)*.022);text-transform:uppercase;letter-spacing:.12em;opacity:.85;max-width:70%;line-height:1.3}
.label::after{content:"";position:absolute;width:5%;height:5%;border-radius:50%;background:#0a0a0c;top:47.5%;left:47.5%}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 6%,rgba(255,255,255,.09) 11%,transparent 17% 52%,rgba(255,255,255,.07) 61%,transparent 67%);-webkit-mask:radial-gradient(circle,transparent 32%,#000 33%);mask:radial-gradient(circle,transparent 32%,#000 33%)}
.arm{position:absolute;right:-7%;top:-6%;width:12%;height:78%;transform-origin:50% 7%;transform:rotate(-5deg);transition:transform 1.4s var(--ease);filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
body.playing .arm{transform:rotate(13deg)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}

/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:18px 22px;padding-top:max(18px,env(safe-area-inset-top))}
.logo{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#fff}
.logo b{font:700 24px Unbounded,sans-serif;letter-spacing:-.05em}
.logo b i{font-style:normal;color:var(--acc)}
.logo span{font-size:13px;color:var(--mute)}
.nav{display:flex;gap:4px;padding:4px;border-radius:99px;margin:0 auto}
.nav button{padding:8px 16px;border-radius:99px;font-size:14px;color:rgba(255,255,255,.75);transition:.3s;white-space:nowrap}
.nav button:hover{color:#fff}
.nav button.on{background:#fff;color:#0a0a0c}
.live{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 14px;border-radius:99px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

/* hero */
.hero{position:fixed;left:22px;bottom:110px;z-index:5;max-width:min(720px,calc(100vw - 44px));transition:opacity .5s,transform .6s var(--ease);pointer-events:none}
.kick{font-size:13px;color:var(--mute);letter-spacing:.02em;display:flex;gap:10px;align-items:center}
.kick em{font-style:normal;color:var(--acc)}
.hero h1{font:700 clamp(40px,8.4vw,112px)/.92 Unbounded,sans-serif;letter-spacing:-.055em;text-transform:uppercase;margin-top:12px;text-wrap:balance}
.hero .cta{display:flex;gap:8px;margin-top:22px;pointer-events:auto}
.btn{height:50px;padding:0 24px;border-radius:99px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,background .3s}
.btn:active{transform:scale(.97)}
.btn.solid{background:#fff;color:#0a0a0c}
.btn.ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
body.pop .hero{opacity:0;transform:translateY(20px)}
@media (min-width:1100px){body.pop .hero{opacity:1;transform:none;max-width:calc(100vw - var(--pw) - 90px)}body.pop .hero .cta{display:none}}

/* player */
.prog{position:absolute;left:64px;right:96px;bottom:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);cursor:pointer;display:none}.prog::before{content:'';position:absolute;inset:-8px 0}.prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--c1,#fff)}body.file .prog{display:block}
.player{position:fixed;left:22px;right:22px;bottom:22px;bottom:max(22px,env(safe-area-inset-bottom));z-index:12;height:68px;border-radius:99px;display:flex;align-items:center;gap:14px;padding:0 10px 0 9px}
.pp{width:50px;height:50px;border-radius:50%;background:#fff;color:#0a0a0c;display:grid;place-items:center;flex:none;transition:transform .2s}
.pp:active{transform:scale(.94)}
.np{flex:1;min-width:0}
.np b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--mute);font-size:13px;white-space:nowrap}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none}
.eq i{width:3px;background:var(--acc);border-radius:2px;height:4px;transition:height .08s}
.tm{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:rgba(255,255,255,.8)}
.ic:hover{background:rgba(255,255,255,.1);color:#fff}

/* side panel */
.panel{position:fixed;z-index:11;right:22px;top:84px;bottom:106px;width:var(--pw);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .45s,transform .6s var(--ease)}
body.pop .panel{opacity:1;transform:none;pointer-events:auto}
.ph{padding:22px 22px 0;flex:none}
.ph h2{font:600 24px Unbounded,sans-serif;letter-spacing:-.04em;text-transform:uppercase}
.ph p{color:var(--mute);font-size:14px;margin-top:4px}
.ph .x{position:absolute;right:14px;top:14px}
.pb{flex:1;min-height:0;overflow:auto;padding:16px 22px 22px;scrollbar-width:none}
.pb::-webkit-scrollbar{display:none}

/* mixes */
.mixes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mix{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;transition:transform .3s var(--ease)}
.mix:hover{transform:translateY(-2px)}
.mix .art{position:absolute;inset:0;z-index:-1;transition:transform 1.2s var(--ease)}
.mix:hover .art{transform:scale(1.06)}
.mix::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 35%,rgba(0,0,0,.6))}
.mix b{font:600 14px/1.15 Unbounded,sans-serif;letter-spacing:-.03em;text-transform:uppercase}
.mix small{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px}
.mix .n{position:absolute;left:14px;top:12px;font:600 12px Unbounded;opacity:.8}
.mix .pl{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}
.mix.on{outline:2px solid #fff;outline-offset:-2px}
.mix.on .pl{background:#fff;color:#0a0a0c}

/* party */
.cd{display:flex;gap:8px;margin-top:10px}
.cd div{flex:1;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.cd b{font:600 20px Unbounded;letter-spacing:-.03em;display:block;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:9px;font-size:14px}
.m{animation:pop .35s var(--ease);line-height:1.4}
.m b{font-weight:500;color:var(--c,#fff);margin-right:6px}
.m.etb{background:rgba(255,184,107,.12);border:1px solid rgba(255,184,107,.25);border-radius:14px;padding:8px 11px}
.m.etb b{color:var(--acc)}
.m.me b{color:#9fd8ff}
.m.sys{color:var(--mute);font-size:12px;text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.pf{flex:none;padding:12px 16px 16px;border-top:1px solid var(--line)}
.reacts{display:flex;gap:6px;margin-bottom:10px}
.reacts button{flex:1;height:38px;border-radius:12px;border:1px solid var(--line);font-size:18px;transition:.2s}
.reacts button:hover{background:rgba(255,255,255,.08)}
.reacts button:active{transform:scale(.9)}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;height:44px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 16px;outline:none}
.say input:focus{border-color:rgba(255,255,255,.4)}
.say button{width:44px;height:44px;border-radius:50%;background:#fff;color:#0a0a0c;display:grid;place-items:center;flex:none}
.fly{position:fixed;z-index:30;pointer-events:none;font-size:26px;animation:fly 2.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-340px) scale(1.3);opacity:0}}

/* booking */
.lbl{font-size:12px;color:var(--mute);margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;transition:.25s}
.opts button:hover{border-color:rgba(255,255,255,.35)}
.opts button.on{background:#fff;color:#0a0a0c;border-color:#fff}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 14px;outline:none;color-scheme:dark}
.field:focus{border-color:rgba(255,255,255,.4)}
.what{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:4px}
.what div{border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--mute)}
.what b{display:block;color:#fff;font-weight:500;font-size:13px;margin-bottom:2px}
.send{width:100%;margin-top:16px;justify-content:center}
.send:disabled{opacity:.35;pointer-events:none}
.bub{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bub>div{padding:10px 14px;border-radius:16px;font-size:14px;animation:pop .35s var(--ease);max-width:90%}
.bub .a{background:rgba(255,255,255,.08);align-self:flex-start;border-bottom-left-radius:5px}
.bub .u{background:#fff;color:#0a0a0c;align-self:flex-end;border-bottom-right-radius:5px}
.typing{display:flex;gap:4px;padding:12px 14px!important}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

@media (max-width:760px){
  #deck{--ds:80vw;--dx:47vw;--dy:40dvh}
  body.pop #deck{--ds:36vw;--dx:48vw;--dy:22dvh}
  .top{flex-wrap:wrap;gap:12px;padding:14px 16px 0;padding-top:max(14px,env(safe-area-inset-top))}
  .logo span{display:none}
  .nav{order:3;margin:0;width:100%;justify-content:space-between}
  .nav button{flex:1;padding:9px 6px;font-size:13.5px}
  .live{margin-left:auto}
  .hero{left:16px;bottom:100px}
    .player{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));height:64px}
  .player .tm,.player .eq{display:none}
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;height:66dvh;border-radius:26px 26px 0 0;transform:translateY(40px);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .panel .pf{padding-bottom:6px}
  .ph{padding:18px 18px 0}.pb{padding:12px 18px 16px}
  .cd{gap:6px;margin-top:8px}.cd div{padding:6px 8px;border-radius:12px;display:flex;align-items:baseline;gap:4px}.cd b{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="deck"><div class="glow" id="glow"></div><div class="disc" id="disc"><div class="label"><b id="lblA">etb</b><span id="lblT"></span></div></div><div class="sheen"></div>
  <svg class="arm" viewBox="0 0 40 300" preserveAspectRatio="none" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#2a2a2f" stroke="#55555c"/><circle cx="20" cy="20" r="5" fill="#8a8a92"/><path d="M20 20 L20 240 L8 270" fill="none" stroke="#c9c9cf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="262" width="18" height="30" rx="3" fill="#2a2a2f" stroke="#55555c" transform="rotate(25 9 277)"/></svg></div>

<header class="top">
  <a class="logo" href="#"><b>etb<i>.</i></b></a>
  <nav class="nav glass" id="nav">
    <button data-p="mixes">Миксы</button>
    <button data-p="party">Тусовка</button>
    <button data-p="book">Букинг</button>
  </nav>
  <button class="live glass" data-p="party"><i></i><span id="lis">live</span></button>
</header>

<section class="hero" id="hero">
  <div class="kick"><em id="hk"></em><span id="hk2"></span></div>
  <h1 id="ht">etb</h1>
  <div class="cta"><button class="btn solid" id="heroPlay"></button></div>
</section>

<aside class="panel glass" id="panel"></aside>

<footer class="player glass">
  <button class="pp" id="pp" aria-label="Играть"></button>
  <div class="np"><b id="npT">etb</b><small id="npS">7 миксов</small></div>
  <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="tm" id="tm">0:00</div>
  <button class="ic" id="prev" aria-label="Предыдущий"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
  <div class="prog" id="prog"><i></i></div>
  <button class="ic" id="next" aria-label="Следующий"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
</footer>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOBILE=matchMedia('(max-width:760px)').matches;

/* ====================================================================
   СЕТЫ etb. Сейчас каждый сет сводит движок в браузере (бесконечно,
   по параметрам ниже). Настоящие миксы подключим сюда же.
   ==================================================================== */
const MIXES=[
  // настоящий микс файлом: src + dur (сек); остальные сводит движок в браузере
  {t:'Wings of a Butterfly',a:'naiq',g:'minimal · techno vip mix',bpm:'123–130',c:['#9fd8ff','#b07cff'],src:'mixes/naiq-wings-of-a-butterfly-v2.mp3',dur:3598},
  {t:'Issyk-Kul Sunset',g:'deep house',bpm:118,root:45,c:['#ff8a5b','#b48cff'],st:{hat:'off',bass:'deep',lead:'pluck',perc:0,swing:.08}},
  {t:'Bishkek Night Drive',g:'melodic techno',bpm:124,root:43,c:['#5b6cff','#ff5fa2'],st:{hat:'16',bass:'roll',lead:'arp',perc:0,swing:0}},
  {t:'Tunduk Afterhours',g:'afro house',bpm:121,root:47,c:['#ffb86b','#2fc3a0'],st:{hat:'shuffle',bass:'afro',lead:'pluck',perc:1,swing:.12}},
  {t:'Ala-Too Sunrise',g:'progressive',bpm:122,root:44,c:['#ffd27a','#ff6b6b'],st:{hat:'16',bass:'roll',lead:'arp',perc:0,swing:.03}},
  {t:'Chunkurchak Echo',g:'organic house',bpm:114,root:46,c:['#7fd18b','#3a6bd9'],st:{hat:'off',bass:'deep',lead:'pluck',perc:1,swing:.1}},
  {t:'Karakol Snow',g:'minimal',bpm:126,root:42,c:['#cfe3ff','#6c7bff'],st:{hat:'shuffle',bass:'afro',lead:null,perc:1,swing:.06}},
];
// Пятничная онлайн-тусовка: день недели (5 = пятница), час по Бишкеку, длительность в часах
const PARTY={day:5,hour:22,dur:4};

/* ================= audio engine ================= */
let el,ac,master,an,fdata,timer,step=0,nextT=0,cur=-1,playing=false,t0=0,elapsed=0,NB,padBus,sendR,sendD;
function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=.7;
  an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.78;fdata=new Uint8Array(an.frequencyBinCount);
  master.connect(comp);comp.connect(an);an.connect(ac.destination);
  NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  // reverb from a generated impulse
  const L=ac.sampleRate*2.6|0,ir=ac.createBuffer(2,L,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}
  const rev=ac.createConvolver();rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(master);
  sendR=ac.createGain();sendR.connect(rev);
  // feedback delay
  const dly=ac.createDelay(1.5);dly.delayTime.value=.37;const fb=ac.createGain();fb.gain.value=.38;const df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=2600;
  dly.connect(df);df.connect(fb);fb.connect(dly);const dg=ac.createGain();dg.gain.value=.4;df.connect(dg);dg.connect(master);
  sendD=ac.createGain();sendD.connect(dly);
  // pad bus, ducked by the kick
  padBus=ac.createGain();padBus.connect(master);padBus.connect(sendR);
  // file mixes play through an <audio> element into the same analyser
  el=new Audio();el.preload='none';ac.createMediaElementSource(el).connect(an);
  el.addEventListener('ended',()=>skip(1));
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(44,t+.11);g.gain.setValueAtTime(1.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(master);o.start(t);o.stop(t+.5);
  padBus.gain.cancelScheduledValues(t);padBus.gain.setValueAtTime(.25,t);padBus.gain.linearRampToValueAtTime(1,t+.28)}
function noise(t,type,f,q,v,d,dest=master){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=NB;s.playbackRate.value=.8+Math.random()*.4;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+d+.02);return g}
const hat=(t,v,open)=>noise(t,'highpass',open?7000:9000,.7,v,open?.2:.045);
function clap(t){[0,.011,.023].forEach((o,i)=>{const g=noise(t+o,'bandpass',1500,1.2,i===2?.32:.18,i===2?.2:.03);if(i===2)g.connect(sendR)})}
function perc(t,p){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(p*1.6,t);o.frequency.exponentialRampToValueAtTime(p,t+.04);env(g,t,.002,.32,.16);o.connect(g);g.connect(master);g.connect(sendR);o.start(t);o.stop(t+.2)}
function bass(t,m,d,cut){const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o2.type='sine';o.frequency.value=o2.frequency.value=hz(m);f.type='lowpass';f.Q.value=7;f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(140,t+d);env(g,t,.008,.3,d);o.connect(f);o2.connect(g);f.connect(g);g.connect(master);[o,o2].forEach(x=>{x.start(t);x.stop(t+d+.05)})}
function pad(t,notes,d){notes.forEach(n=>[-8,0,9].forEach(det=>{const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=hz(n);o.detune.value=det;f.type='lowpass';f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(1600,t+d*.5);f.frequency.linearRampToValueAtTime(600,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.018,t+d*.35);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(padBus);o.start(t);o.stop(t+d+.05)}))}
function lead(t,m,d,kind){const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=kind==='arp'?'square':'triangle';o.frequency.value=hz(m);f.type='lowpass';f.frequency.setValueAtTime(kind==='arp'?2400:3200,t);f.frequency.exponentialRampToValueAtTime(400,t+d);env(g,t,.004,kind==='arp'?.07:.12,d);o.connect(f);f.connect(g);g.connect(master);g.connect(sendD);g.connect(sendR);o.start(t);o.stop(t+d+.05)}
const PROG=[[0,3,7,10],[-4,0,3,7],[-2,2,5,9],[-5,-1,2,5]];
const ARP=[0,7,12,3,10,7,15,12],PL=[0,3,6,10,13];
function schedule(){
  const m=MIXES[cur],S=m.st,sp=60/m.bpm/4;
  while(nextT<ac.currentTime+.14){
    const s=step%16,bar=Math.floor(step/16),ch=PROG[bar%4],r=m.root,phrase=Math.floor(bar/8)%4;
    const t=nextT+(s%2?S.swing*sp:0);
    const brk=phrase===3&&bar%8>=4; // every 32 bars: a 4-bar breakdown
    if(!brk&&s%4===0)kick(t);
    if(!brk&&(s===4||s===12))clap(t);
    if(S.hat==='off'){if(s%4===2)hat(t,.14,true)}
    else if(S.hat==='16')hat(t,s%4===2?.14:.05,s%4===2);
    else if(s%3!==1)hat(t,s%4===2?.13:.06,s%8===6);
    if(S.perc&&!brk&&[3,6,10,11,14].includes(s))perc(t,s%2?180:260);
    if(!brk){
      if(S.bass==='deep'&&[3,6,11,14].includes(s))bass(t,r+ch[0],sp*2.2,700);
      else if(S.bass==='roll'&&s%4!==0)bass(t,r+ch[0]+(s%4===3?12:0),sp*.9,1100+600*Math.sin(bar/3));
      else if(S.bass==='afro'&&[2,5,8,11,14].includes(s))bass(t,r+ch[0]+(s===8?7:0),sp*1.5,900);
    }
    if(s===0)pad(t,ch.map(x=>r+24+x),sp*16);
    if(S.lead==='arp'&&phrase>=1)lead(t,r+36+ch[0]+ARP[s%8],sp*.9,'arp');
    if(S.lead==='pluck'&&phrase>=1&&PL.includes(s))lead(t,r+36+ch[[0,1,2,3,2][PL.indexOf(s)]]+(bar%2?12:0),sp*2,'pluck');
    if(brk&&s===0&&bar%8===7)noise(t,'highpass',600,1,.12,sp*16,sendR); // riser into the drop
    step++;nextT+=sp;
  }
}
function play(i){
  initAudio();ac.resume();
  if(i===cur&&playing){pause();return}
  if(i!==cur){cur=i;step=0;elapsed=0;el.pause();if(MIXES[i].src){el.src=MIXES[i].src}}
  const m=MIXES[cur];playing=true;clearInterval(timer);
  if(m.src)el.play();
  else{nextT=ac.currentTime+.08;t0=ac.currentTime-elapsed;timer=setInterval(schedule,25)}
  document.body.classList.toggle('file',!!m.src);
  ui();
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:m.t,artist:m.a||'etb',album:m.g});
}
function pause(){if(!playing)return;playing=false;if(MIXES[cur].src)el.pause();else{elapsed=ac.currentTime-t0;clearInterval(timer)}ui()}
$('#prog').onclick=e=>{const m=MIXES[cur];if(!m||!m.src)return;const r=e.currentTarget.getBoundingClientRect();el.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(el.duration||m.dur)};
const toggle=()=>playing?pause():play(cur<0?0:cur);
const skip=d=>play(((cur<0?0:cur)+d+MIXES.length)%MIXES.length);
function bands(){
  if(!an)return [0,0,0];
  an.getByteFrequencyData(fdata);const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=fdata[i];return s/(b-a)/255};
  return [avg(1,6),avg(6,40),avg(40,140)];
}

/* ================= the deck ================= */
const disc=$('#disc'),glow=$('#glow'),deck=$('#deck');
let ang=0,spd=0,last=0,lv=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  spd+=((playing?200:0)-spd)*Math.min(1,dt*(playing?1.6:2.4)); // 33⅓ rpm ≈ 200°/s; spins up and slows down like a real deck
  ang=(ang+spd*dt)%360;disc.style.transform=`rotate(${ang}deg)`;
  const b=playing?bands():[0,0,0];lv+=(b[0]-lv)*(b[0]>lv?.5:.1);
  glow.style.opacity=(.14+lv*.5).toFixed(3);deck.style.scale=(1+lv*.012).toFixed(4);
  if(playing&&fdata){document.querySelectorAll('#eq i').forEach((e,i)=>e.style.height=(4+fdata[3+i*14]/255*18)+'px');const m=MIXES[cur];if(m.src){const d=el.duration||m.dur;$('#tm').textContent=clock(el.currentTime)+' / '+clock(d);$('#prog i').style.width=(el.currentTime/d*100)+'%'}else $('#tm').textContent=clock(ac.currentTime-t0)}
  requestAnimationFrame(frame);
}
const clock=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0,ss=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`};
requestAnimationFrame(frame);
function paintDeck(m){
  deck.style.setProperty('--lab',`radial-gradient(circle at 30% 25%,${m.c[0]},${m.c[1]} 75%)`);
  deck.style.setProperty('--c1',m.c[0]);deck.style.setProperty('--c2',m.c[1]);document.body.style.setProperty('--c1',m.c[0]);$('#lblT').textContent=m.t;$('#lblA').textContent=m.a||'etb';
}
paintDeck(MIXES[0]);

/* ================= UI ================= */
const PLAY='<svg width="16" height="16" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>',PAUSE='<svg width="16" height="16" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/></svg>';
function ui(){
  $('#pp').innerHTML=playing?PAUSE:PLAY;$('#pp').setAttribute('aria-label',playing?'Пауза':'Играть');
  $('#heroPlay').innerHTML=(playing?PAUSE:PLAY)+(playing?'Пауза':'Слушать');
  document.body.classList.toggle('playing',playing);
  if(cur>=0){const m=MIXES[cur];paintDeck(m);
    $('#npT').textContent=(m.a?m.a+' — ':'')+m.t;$('#npS').textContent=`${m.g} · ${m.bpm}`;
    $('#ht').textContent=m.t;$('#hk').textContent=playing?'играет':'пауза';$('#hk2').textContent=`${m.g} · ${m.bpm}`;
  }
  document.querySelectorAll('.mix').forEach((el,i)=>{el.classList.toggle('on',i===cur&&playing);el.querySelector('.pl').innerHTML=i===cur&&playing?PAUSE:PLAY});
  if(!playing)document.querySelectorAll('#eq i').forEach(e=>e.style.height='4px');
}
$('#pp').onclick=toggle;$('#heroPlay').onclick=toggle;$('#prev').onclick=()=>skip(-1);$('#next').onclick=()=>skip(1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight')skip(1);else if(e.key==='ArrowLeft')skip(-1);else if(e.key==='Escape')closePanel()});
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('play',()=>play(cur<0?0:cur));navigator.mediaSession.setActionHandler('pause',pause);navigator.mediaSession.setActionHandler('nexttrack',()=>skip(1));navigator.mediaSession.setActionHandler('previoustrack',()=>skip(-1))}

const panel=$('#panel');let open=null,timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const X='<button class="ic x" id="px" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6"><path d="M2 2l10 10M12 2L2 12"/></svg></button>';
function openPanel(p){
  if(open===p){closePanel();return}
  timers.forEach(clearTimeout);timers=[];open=p;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  ({mixes:mixesPanel,party:partyPanel,book:bookPanel})[p]();
  $('#px').onclick=closePanel;
  document.body.classList.add('pop');history.replaceState(null,'','#'+p);
}
function closePanel(){open=null;timers.forEach(clearTimeout);timers=[];document.body.classList.remove('pop');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));history.replaceState(null,'',location.pathname)}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));

/* --- mixes --- */
function mixesPanel(){
  panel.innerHTML=`<div class="ph">${X}<h2>Миксы</h2></div>
    <div class="pb"><div class="mixes">${MIXES.map((m,i)=>`<button class="mix" data-i="${i}"><div class="art" style="background:radial-gradient(circle at ${30+i*9}% ${70-i*7}%,${m.c[0]},transparent 60%),radial-gradient(circle at ${75-i*6}% ${25+i*8}%,${m.c[1]},transparent 62%),conic-gradient(from ${i*60}deg at 50% 50%,${m.c[1]},#0d0d12,${m.c[0]},#0d0d12,${m.c[1]})"></div><span class="n">${String(i+1).padStart(2,'0')}</span><span class="pl"></span><b>${m.t}</b><small>${m.a?m.a+' · ':''}${m.g} · ${m.bpm}${m.dur?' · '+Math.round(m.dur/60)+' мин':''}</small></button>`).join('')}</div></div>`;
  panel.querySelectorAll('.mix').forEach(b=>b.onclick=()=>play(+b.dataset.i));
  ui();
}

/* --- online party --- */
const BISH=6*3600e3; // Bishkek: UTC+6 all year
function partyState(){
  const now=new Date(Date.now()+BISH),d=now.getUTCDay(),mins=now.getUTCHours()*60+now.getUTCMinutes();
  const start=PARTY.hour*60,len=PARTY.dur*60;
  const since=((d-PARTY.day+7)%7)*1440+mins-start;
  if(since>=0&&since<len)return {live:true,left:(len-since)*60};
  let until=((PARTY.day-d+7)%7)*1440+start-mins;if(until<=0)until+=7*1440;
  return {live:false,until:until*60-now.getUTCSeconds()};
}
const FANS=[['Айбек','Бишкек','#ffb86b'],['Нурай','Каракол','#ff8fb1'],['dana.kz','Алматы','#9fd8ff'],['Тимур','Ош','#b9f27c'],['Салтанат','Бишкек','#d1a8ff'],['Эрлан','Чолпон-Ата','#ffd27a'],['aru','Ташкент','#7fe0d0'],['Мирлан','Москва','#ffa98a'],['Бекжан','Токмок','#a8c8ff'],['Айпери','Бишкек','#ffb3d9']];
const LINES=['🔥🔥🔥','этот дроп 😮‍💨','привет из {c}!','etb, давай погромче','под закат идеально','кто в пятницу на тусовке?','бас качает','сохранила сет','🙌🙌','каждый вечер тут','etb, когда в {c} приедешь?','музыка для дороги на Иссык-Куль','включила на работе 🤫','вайб 💜'];
const ETB=['Рад всех видеть. Дальше — немного глубже.','Привет, {c}! Этот переход для вас.','Танцуем до утра.','Следующий трек — заказ из чата.','Пятница, 22:00. Не пропустите.','Живьём — через «Букинг».'];
let listeners=280+Math.random()*120|0;
function partyPanel(){
  const st=partyState();
  panel.innerHTML=`<div class="ph">${X}<h2>Тусовка</h2><p><span id="lc">${listeners}</span> слушают</p>${st.live?`<p style="color:var(--acc)">Пятница идёт · ещё ${clock(st.left)}</p>`:`<p style="margin-top:10px;color:#fff">Пятница, 22:00</p><div class="cd" id="cd"></div>`}</div>
    <div class="pb" id="pb"><div class="chat" id="chat"></div></div>
    <div class="pf"><div class="reacts" id="rx">${['🔥','💜','🙌','🎧','😮‍💨'].map(e=>`<button>${e}</button>`).join('')}</div>
      <form class="say" id="say"><input id="sin" placeholder="Сообщение или трек" autocomplete="off" maxlength="140"><button aria-label="Отправить"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 8l14-6-5 14-2-6z"/></svg></button></form></div>`;
  if(!playing)play(cur<0?1:cur);
  const chat=$('#chat'),pb=$('#pb');
  const add=html=>{chat.insertAdjacentHTML('beforeend',html);while(chat.children.length>60)chat.firstElementChild.remove();pb.scrollTo({top:pb.scrollHeight,behavior:'smooth'})};
  const fan=()=>{const [n,c,co]=FANS[Math.random()*FANS.length|0];add(`<div class="m" style="--c:${co}"><b>${n}</b>${esc(LINES[Math.random()*LINES.length|0].replace('{c}',c))}</div>`);return c};
  const etb=t=>add(`<div class="m etb"><b>etb</b>${esc(t)}</div>`);
  for(let i=0;i<5;i++)fan();
  const loop=()=>{if(open!=='party')return;const c=fan();if(Math.random()<.18)later(()=>open==='party'&&etb(ETB[Math.random()*ETB.length|0].replace('{c}',c)),1400);
    listeners=Math.max(150,listeners+(Math.random()*9-4|0));$('#lc').textContent=listeners;$('#lis').textContent=`live · ${listeners}`;
    if(Math.random()<.35)flyFrom(null,['🔥','💜','🙌'][Math.random()*3|0]);
    later(loop,1400+Math.random()*2400)};
  later(loop,900);
  const tick=()=>{if(open!=='party'||!$('#cd'))return;const s=partyState();if(s.live)return;const u=s.until,d=u/86400|0,h=u%86400/3600|0,m=u%3600/60|0,ss=u%60|0;
    $('#cd').innerHTML=[[d,'дн'],[h,'ч'],[m,'мин'],[ss,'сек']].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');later(tick,1000)};
  tick();
  $('#rx').querySelectorAll('button').forEach(b=>b.onclick=()=>flyFrom(b,b.textContent));
  $('#say').onsubmit=e=>{e.preventDefault();const v=$('#sin').value.trim();if(!v)return;$('#sin').value='';
    add(`<div class="m me"><b>вы</b>${esc(v)}</div>`);
    const low=v.toLowerCase();
    later(()=>{
      if(open!=='party')return;
      if(/трек|постав|включи|заказ|песн/.test(low)){etb('Принял заказ 🎧 Сведу его в следующий переход.');later(()=>{if(open!=='party')return;skip(1);add(`<div class="m sys">etb сменил сет · ${MIXES[cur].t}</div>`)},3500)}
      else if(/привет|салам|хай|hello|hi\b/.test(low))etb('Привет! Рад, что ты с нами. Откуда слушаешь?');
      else if(/при[её]д|выступ|концерт|живь|брон|букинг/.test(low))etb('Живьём — через «Букинг», отвечу за час.');
      else etb(['Слышу тебя 🙌','Держи следующий дроп — для тебя.','Лучший чат в городе.','💜'][Math.random()*4|0]);
    },1200+Math.random()*800);
  };
}
function flyFrom(btn,e){
  const pr=panel.getBoundingClientRect(),r=btn?btn.getBoundingClientRect():{left:pr.left+40+Math.random()*(pr.width-80),top:pr.bottom-130,width:0};
  const el=document.createElement('div');el.className='fly';el.textContent=e;el.style.left=(r.left+r.width/2-13)+'px';el.style.top=r.top+'px';el.style.setProperty('--dx',(Math.random()*80-40)+'px');
  document.body.append(el);setTimeout(()=>el.remove(),2300);
}

/* --- booking --- */
let reqNo=1040;
function bookPanel(){
  const sel={f:'Клуб',c:'Бишкек'};
  const opt=(k,arr)=>`<div class="opts" data-k="${k}">${arr.map(v=>`<button type="button" class="${sel[k]===v?'on':''}">${v}</button>`).join('')}</div>`;
  const min=new Date(Date.now()+BISH+86400e3).toISOString().slice(0,10);
  panel.innerHTML=`<div class="ph">${X}<h2>Букинг</h2></div>
    <div class="pb"><form id="bf">
      <div class="lbl">Формат</div>${opt('f',['Клуб','Частное','Корпоратив','Фестиваль','Свадьба'])}
      <div class="lbl">Город</div>${opt('c',['Бишкек','Иссык-Куль','Алматы','Ташкент','Другой'])}
      <div class="lbl">Дата</div><input class="field" type="date" id="bd" min="${min}" required>
      <div class="lbl">Контакт</div><input class="field" id="bc" placeholder="Telegram или телефон" required autocomplete="off">
      <button class="btn solid send" id="bs">Отправить</button>
    </form><div class="bub" id="bub"></div></div>`;
  panel.querySelectorAll('.opts').forEach(o=>o.querySelectorAll('button').forEach(b=>b.onclick=()=>{sel[o.dataset.k]=b.textContent;o.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}));
  $('#bf').onsubmit=async e=>{e.preventDefault();$('#bs').disabled=true;
    const d=new Date($('#bd').value+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),bub=$('#bub'),pb=panel.querySelector('.pb');
    const say=async(t,cls='a')=>{if(cls==='a'){bub.insertAdjacentHTML('beforeend','<div class="a typing"><i></i><i></i><i></i></div>');pb.scrollTo({top:pb.scrollHeight,behavior:'smooth'});await sleep(1100);bub.lastElementChild.remove()}
      bub.insertAdjacentHTML('beforeend',`<div class="${cls}">${t}</div>`);pb.scrollTo({top:pb.scrollHeight,behavior:'smooth'})};
    await say(esc(`${sel.f}, ${sel.c}, ${d}`),'u');
    await say(`${d} — свободно ✓ Сколько гостей?<div class="opts" style="margin-top:10px" id="gq"><button>до 100</button><button>100–500</button><button>500+</button></div>`);
    $('#gq').querySelectorAll('button').forEach(b=>b.onclick=async()=>{$('#gq').remove();await say(esc(b.textContent),'u');
      await say(`Заявка №E-${++reqNo} ✓ Райдер и гонорар пришлю на ${esc($('#bc').value)} в течение часа.`)});
  };
}

/* boot */
ui();
const h=location.hash.slice(1);if(['mixes','party','book'].includes(h))openPanel(h);
$('#lis').textContent=`live · ${listeners}`;
window.__w={play,pause,openPanel,closePanel,get cur(){return cur},get playing(){return playing}};
</script>
</body>
