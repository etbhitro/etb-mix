<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>etb.world</title>
<meta name="description" content="Улица, где в каждой двери работает агент.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1a15;--mute:#8a7e70;--bronze:#a47148;--paper:#f7f2ea;--line:rgba(31,26,21,.1);--hud:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0f1f}
body{font:400 17px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#gl.hov{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:var(--hud);transition:color 1s}
.hud>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(rgba(0,0,0,.28),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.logo{font:700 19px Unbounded,sans-serif;letter-spacing:-.04em;color:inherit;text-decoration:none}
.logo i{font-style:normal;color:#ffb86b}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;letter-spacing:.02em;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:#7CF29A;animation:blink 1.6s infinite}
.chip.lapse .dot{background:#ffb86b}
@keyframes blink{50%{opacity:.25}}
.place{position:absolute;left:20px;bottom:24px;right:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;pointer-events:none;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.pl-l{overflow:hidden}
.pl-n{font:400 12px/1 Onest;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-bottom:14px}
.pl-t{font:500 clamp(34px,6.4vw,92px)/.92 Onest;letter-spacing:-.045em;text-transform:uppercase;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s}
.pl-s{margin-top:12px;font-size:14px;letter-spacing:.02em;display:flex;gap:10px;align-items:center;opacity:.9;transition:opacity .5s}
.pl-s i{width:7px;height:7px;border-radius:50%;background:#7CF29A}
.pl-s i.off{background:#ffb86b}
.swap .pl-t{transform:translateY(105%);opacity:0}
.swap .pl-s{opacity:0}
.pl-r{text-align:right;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;white-space:nowrap}
.bar{width:140px;height:1px;background:rgba(255,255,255,.35);margin-top:10px;margin-left:auto;position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:#fff}
.back{position:absolute;left:20px;top:76px;display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);font-weight:500;font-size:15px}
.back.on{display:inline-flex}
.look{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:13px;opacity:0;transition:opacity .6s;white-space:nowrap;letter-spacing:.06em}
.look.on{opacity:.85}
.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0b0f1f;color:#fff;font:700 28px Unbounded;letter-spacing:-.04em;transition:opacity .8s}
.loading.off{opacity:0;pointer-events:none}
.loading i{font-style:normal;color:#ffb86b}

/* panel */
.panel{position:fixed;z-index:20;top:16px;right:16px;bottom:16px;width:min(440px,calc(100% - 32px));background:rgba(251,248,243,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:28px;padding:28px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .7s cubic-bezier(.2,.7,.2,1);overscroll-behavior:contain;border:1px solid rgba(255,255,255,.6)}
.panel.on{transform:none}
.x{position:absolute;right:18px;top:18px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.kick{font:400 12px Onest;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center;margin-bottom:12px}
.kick i{width:7px;height:7px;border-radius:50%;background:#3dbd7d}
.kick.off i{background:#c9a27a}
.panel h3{font:500 34px/.95 Onest;letter-spacing:-.04em;text-transform:uppercase;margin-bottom:8px;padding-right:44px}
.sub{color:var(--mute);font-size:15px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:15px;transition:transform .3s,opacity .3s}
.pill:hover{transform:translateY(-2px)}
.pill.solid{background:var(--ink);color:var(--paper);border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(31,26,21,.06);margin-bottom:16px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 15px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.menu{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.it .ph{width:44px;height:44px;border-radius:12px}
.it b{font-weight:500;display:block;font-size:15px;line-height:1.25}
.it small{color:var(--mute);font-size:13px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:17px;line-height:1}
.qty span{min-width:12px;text-align:center;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.tot{font:300 26px Onest;letter-spacing:-.03em}
.msgs{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:86%;padding:11px 15px;border-radius:20px;font-size:15px;line-height:1.4;animation:pop .45s ease}
.b.mine{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:6px}
.b.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-4px);opacity:.4}}
.form{display:flex;gap:10px;flex-wrap:wrap}
.form input{flex:1;min-width:170px;padding:13px 20px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;color:inherit;outline:none}
.form input:focus{border-color:var(--bronze)}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);animation:pop .5s}
.fi b{font-weight:500;font-size:14px;display:block}
.fi span{font-size:14px;color:var(--mute)}
.fi time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
@media (max-width:700px){
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh;border-radius:26px;transform:translateY(calc(100% + 30px))}
  .panel.on{transform:none}
  .chip{font-size:12px;padding:7px 11px}
  .pl-r{display:none}
  body.panel-open .place{opacity:0}
}
.place{transition:opacity .4s}
body.panel-open .look{opacity:0}
</style>

<body>
<div class="loading" id="loading">etb<i>.</i>world</div>
<canvas id="gl"></canvas>

<div class="hud" id="hud">
  <div class="top">
    <a class="logo" href="#">etb<i>.</i>world</a>
    <div class="chips">
      <button class="chip" id="wx" title="Погода"><span id="wxIc"></span><span id="wxTx">Бишкек</span></button>
      <button class="chip" id="clk" title="Прокрутить сутки"><span class="dot"></span><span id="clkTx">--:--</span></button>
    </div>
  </div>
  <button class="back" id="back">← На улицу</button>
  <div class="place" id="place">
    <div class="pl-l"><div class="pl-n" id="plN"></div><div class="pl-t" id="plT"></div><div class="pl-s" id="plS"></div></div>
    <div class="pl-r"><span id="plR"></span><div class="bar"><i id="plBar"></i></div></div>
  </div>
  <div class="look" id="look">тяни, чтобы осмотреться</div>
</div>

<aside class="panel" id="panel"></aside>

<script type="module">
import * as THREE from 'three';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>n.toLocaleString('ru-RU');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= time (Бишкек) ================= */
const TZ='Asia/Bishkek';
let simOffset=0,lapse=null;
function minutesNow(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+simOffset));
  return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value;
}
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
let SUN={rise:438,set:1095};

/* ================= places ================= */
const PLACES=[
  {k:'shop',name:'Kazan',line:'кухня Азии',hours:[660,1380],wall:'#c7744f',sign:['KAZAN','#fff6ea','#7a3b25'],inside:'#e9d2b4',acc:'#a8553a',agent:'Продавец принимает заказы',
    modes:['Доставка','На вынос'],menu:[['Лагман',450],['Плов',420],['Манты, 5 шт',380],['Шашлык из баранины',520],['Чай с чабрецом',150]],c:['#e6a46d','#a8553a'],furn:'tables'},
  {k:'ad',name:'Рекламное место',line:'щит на улице · свободно'},
  {k:'shop',name:'NDWS',line:'спортивное питание',hours:[600,1200],wall:'#1a1f12',sign:['NDWS','#12160c','#c8f04a'],inside:'#2b3220',acc:'#9cc420',agent:'Продавец онлайн',
    modes:['Доставка','Самовывоз'],menu:[['Creatine',1700],['Omega-3',2100],['D3 + K2',1950],['Ashwagandha',2800],['Collagen + C',3400],['Whey + Collagen',3200]],c:['#9cc420','#2b3a10'],furn:'shelves'},
  {k:'ad',name:'Экран на улице',line:'ваш ролик · 24/7',screen:1},
  {k:'shop',name:'Супара Талкан',line:'сладости ручной работы',hours:[540,1260],wall:'#efe0c8',sign:['СУПАРА ТАЛКАН','#5a3a22','#f6e6d2'],inside:'#f3e4cc',acc:'#a47148',agent:'Продавец онлайн',
    modes:['Доставка','Самовывоз'],menu:[['Талкан классический',null],['Талкан с орехами',null],['Подарочный набор',null],['Курут',null]],c:['#c9925a','#5a3a22'],furn:'shelves'},
  {k:'shop',name:'Кофе с собой',line:'кофейня на углу',hours:[480,1320],wall:'#3a2f26',sign:['КОФЕ','#ffc27f','#3a2f26'],inside:'#d8c3a5',acc:'#7a5536',agent:'Бариста-бот',
    modes:['На вынос'],menu:[['Капучино',220],['Латте',240],['Американо',180],['Круассан',200]],c:['#c89b6d','#5a3a22'],furn:'tables'},
  {k:'shop',name:'Бар «Луна»',line:'коктейли до 4 утра',hours:[1080,1680],wall:'#22243a',sign:['ЛУНА','#22243a','#ffd9a0'],inside:'#3a3358',acc:'#7a6cff',agent:'Бармен-бот',
    modes:['Бронь','На вынос'],menu:[['Столик на двоих',null],['Столик на компанию',null],['Лимонад с собой',350],['Сет закусок',890]],c:['#7a6cff','#22243a'],furn:'bar'},
  {k:'office',name:'etb.ai',line:'офис агентов · 24/7',hours:null,wall:'#6f8295',sign:['etb.ai','#1f1a15','#ffffff'],inside:'#dfe6ee',acc:'#3d6fa8',agent:'Агенты на смене',furn:'desks',tall:46},
  {k:'meet',name:'Переговорная',line:'личная ссылка для партнёров',hours:null,wall:'#f3ebdf',sign:['ПЕРЕГОВОРНАЯ','#a47148','#ffffff'],inside:'#efe6d8',acc:'#a47148',agent:'Протоколист готов',furn:'meet'},
  {k:'ad',name:'Место для бренда',line:'щит · экран · витрина'},
];
const GAP=17,Z0=-14;
PLACES.forEach((p,i)=>{p.i=i;p.z=Z0-i*GAP;p.s=i%2?1:-1});
const END=Z0-(PLACES.length-1)*GAP;

function openState(p,m){
  if(!p.hours)return {open:true};
  const [o,c]=p.hours,inside=x=>x>=o&&x<c;
  return {open:inside(m)||inside(m+1440),opens:hhmm(o),closes:hhmm(c)};
}

/* ================= renderer / scene ================= */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1500);
camera.rotation.order='YXZ';
scene.fog=new THREE.Fog(0xf7eee2,40,260);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

const hemi=new THREE.HemisphereLight(0xbcd6e8,0x8a7e70,2);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xfff1d6,2.2);scene.add(sunL);scene.add(sunL.target);

/* --- helpers --- */
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
const radial=canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h)});
function signTex(text,bg,fg){
  return canvasTex(1024,192,(g,w,h)=>{g.fillStyle=bg;g.beginPath();g.roundRect(0,0,w,h,28);g.fill();g.fillStyle=fg;let fs=110;g.font=`600 ${fs}px Unbounded`;while(g.measureText(text).width>w-120){fs-=6;g.font=`600 ${fs}px Unbounded`}g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+6)});
}
function winTextures(seed){
  let s=seed;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const cols=3,rows=3;
  const map=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){g.fillStyle='#4a5260';g.fillRect(18+c*80,26+r*80,48,50);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(18+c*80,26+r*80,48,4)}});
  const em=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(rnd()<.42){g.fillStyle=rnd()<.5?'#c9965a':'#e0b98a';g.fillRect(18+c*80,26+r*80,48,50)}}});
  for(const t of [map,em]){t.wrapS=t.wrapT=THREE.RepeatWrapping}
  return {map,em};
}
const facadeMats=[];
function facadeMat(color,w,h,seed,litAlways=false){
  const {map,em}=winTextures(seed);
  map.repeat.set(w/4.2,h/3.4);em.repeat.copy(map.repeat);
  const m=new THREE.MeshLambertMaterial({color,map,emissive:0xffd08a,emissiveMap:em,emissiveIntensity:0});
  m.userData.always=litAlways;facadeMats.push(m);return m;
}

/* ================= sky ================= */
const skyU={top:{value:new THREE.Color('#bcd6e8')},bot:{value:new THREE.Color('#f7eee2')}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform vec3 top;uniform vec3 bot;varying vec3 vW;void main(){float h=normalize(vW-cameraPosition).y;gl_FragColor=vec4(mix(bot,top,clamp(pow(max(h,0.),.55),0.,1.)),1.);
  #include <colorspace_fragment>
  }`}));
scene.add(sky);
const starGeo=new THREE.BufferGeometry();{const a=[];for(let i=0;i<900;i++){const t=Math.random()*Math.PI*2,u=Math.random()*.9+.08,r=800;a.push(Math.cos(t)*Math.sqrt(1-u*u)*r,u*r,Math.sin(t)*Math.sqrt(1-u*u)*r)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(a,3))}
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));scene.add(stars);
const sunS=new THREE.Sprite(new THREE.SpriteMaterial({map:radial,color:0xffd9a0,fog:false,depthWrite:false,transparent:true}));sunS.scale.set(150,150,1);scene.add(sunS);
const moonS=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(128,128,(g)=>{const r=g.createRadialGradient(54,54,0,64,64,64);r.addColorStop(0,'#fbf7ee');r.addColorStop(.45,'#e6e2d6');r.addColorStop(.5,'rgba(220,225,255,.25)');r.addColorStop(1,'rgba(220,225,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128)}),fog:false,depthWrite:false,transparent:true}));moonS.scale.set(70,70,1);scene.add(moonS);
const cloudMat=new THREE.SpriteMaterial({map:radial,color:0xffffff,transparent:true,opacity:0,fog:false,depthWrite:false});
const clouds=[];for(let i=0;i<22;i++){const c=new THREE.Sprite(cloudMat);c.scale.set(260+Math.random()*200,70+Math.random()*50,1);c.userData={a:Math.random()*Math.PI*2,r:500+Math.random()*250,y:120+Math.random()*140,v:.00004+Math.random()*.00005};scene.add(c);clouds.push(c)}

/* mountains (Ала-Тоо at the end of the street) */
const mtnMat=new THREE.MeshBasicMaterial({color:0xcdbba6,fog:false});
const capMat=new THREE.MeshBasicMaterial({color:0xffffff,fog:false});
const mtns=new THREE.Group();scene.add(mtns);
for(let i=0;i<13;i++){const h=90+((i*53)%80),r=110+((i*37)%70);const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,5),mtnMat);m.position.set(-430+i*72,h/2-8,-560-((i*29)%90));m.rotation.y=i;mtns.add(m);
  const c=new THREE.Mesh(new THREE.ConeGeometry(r*.24,h*.24,5),capMat);c.position.set(m.position.x,h-8-h*.12+.5,m.position.z);c.rotation.y=i;mtns.add(c)}

/* ================= street ================= */
const roadMat=new THREE.MeshLambertMaterial({color:0x6c6a6a});
const walkMat=new THREE.MeshLambertMaterial({color:0xcfc6b8});
const groundMat=new THREE.MeshLambertMaterial({color:0xbdb2a2});
const L=-END+80;
const road=new THREE.Mesh(new THREE.PlaneGeometry(8,L+120),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,0,-L/2+40);scene.add(road);
for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(2.4,.16,L+120),walkMat);w.position.set(s*5.2,.08,-L/2+40);scene.add(w)}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,1200),groundMat);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.02,-400);scene.add(ground);
const dashMat=new THREE.MeshBasicMaterial({color:0xf2efe8});
for(let z=20;z>END-60;z-=6){const d=new THREE.Mesh(new THREE.PlaneGeometry(.16,2.6),dashMat);d.rotation.x=-Math.PI/2;d.position.set(0,.01,z);scene.add(d)}

const WX={clear:['ясно','☀️','🌙'],partly:['малооблачно','🌤','☁️'],cloudy:['облачно','☁️','☁️'],fog:['туман','🌫','🌫'],rain:['дождь','🌧','🌧'],snow:['снег','🌨','🌨'],storm:['гроза','⛈','⛈']};

function kindOf(c){if(c===0)return'clear';if(c<=2)return'partly';if(c===3)return'cloudy';if(c===45||c===48)return'fog';if((c>=51&&c<=67)||(c>=80&&c<=82))return'rain';if((c>=71&&c<=77)||c===85||c===86)return'snow';if(c>=95)return'storm';return'cloudy'}
async function loadWeather(){
  try{
    const j=await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=42.87&longitude=74.59&current=temperature_2m,weather_code,wind_speed_10m&daily=sunrise,sunset&timezone=Asia%2FBishkek&forecast_days=1')).json();
    const t=s=>{const [h,mm]=s.slice(11,16).split(':');return +h*60+ +mm};
    SUN={rise:t(j.daily.sunrise[0]),set:t(j.daily.sunset[0])};
    if(wx.real)wx={kind:kindOf(j.current.weather_code),temp:Math.round(j.current.temperature_2m),wind:j.current.wind_speed_10m,real:true};
  }catch(e){}
}
// precipitation around the camera
const RN=2400;
const rainGeo=new THREE.BufferGeometry();const rainPos=new Float32Array(RN*6);rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0xc8d4e6,transparent:true,opacity:.55}));rain.frustumCulled=false;scene.add(rain);
const snowGeo=new THREE.BufferGeometry();const snowPos=new Float32Array(RN*3);snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));
const snow=new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xffffff,size:.15,transparent:true,opacity:.95,map:radial,depthWrite:false}));snow.frustumCulled=false;scene.add(snow);
const drops=Array.from({length:RN},()=>({x:(Math.random()-.5)*36,y:Math.random()*22,z:-Math.random()*50+8,v:Math.random()}));
let flashT=0,nextFlash=0;
function updatePrecip(dt,t){
  const k=wx.kind,isRain=k==='rain'||k==='storm',isSnow=k==='snow';
  rain.visible=isRain;snow.visible=isSnow;
  const n=k==='storm'?RN:k==='rain'?1500:1300,wind=Math.min(1,(wx.wind||5)/30);
  const cz=camera.position.z,cxp=camera.position.x;
  if(isRain){for(let i=0;i<RN;i++){const d=drops[i],o=i*6;if(i>=n){rainPos.fill(0,o,o+6);continue}d.y-=(.55+d.v*.3)*dt*60;d.x-=wind*.08*dt*60;if(d.y<0){d.y=20+Math.random()*2;d.x=(Math.random()-.5)*36}
    let z=d.z+cz;rainPos[o]=d.x+cxp;rainPos[o+1]=d.y;rainPos[o+2]=z;rainPos[o+3]=d.x+cxp-wind*.15;rainPos[o+4]=d.y-.55;rainPos[o+5]=z}rainGeo.attributes.position.needsUpdate=true}
  if(isSnow){for(let i=0;i<RN;i++){const d=drops[i],o=i*3;if(i>=n){snowPos.fill(0,o,o+3);continue}d.y-=(.02+d.v*.03)*dt*60;d.x+=Math.sin(t/1000+i)*.006-wind*.01;if(d.y<0){d.y=20;d.x=(Math.random()-.5)*36}snowPos[o]=d.x+cxp;snowPos[o+1]=d.y;snowPos[o+2]=d.z+cz}snowGeo.attributes.position.needsUpdate=true}
  if(k==='storm'&&t>nextFlash){nextFlash=t+4000+Math.random()*7000;flashT=1}
  flashT=Math.max(0,flashT-dt*2.5);
}

const PAL={
  night:{top:'#0a0f24',bot:'#1f2a4d',hemiS:'#2b3560',hemiG:'#141826',mtn:'#232a45',road:'#2a2b33',walk:'#3a3c48',grd:'#24283b',leaf:'#34433a',fog:'#18203b',d:1},
  dawn:{top:'#4b4a7d',bot:'#f3b183',hemiS:'#e4b39a',hemiG:'#6b5a5a',mtn:'#8b7b8c',road:'#5d5b5e',walk:'#a99a92',grd:'#9c8f88',leaf:'#7d8a68',fog:'#e9b08f',d:.45},
  day:{top:'#9cc4e2',bot:'#f4ece0',hemiS:'#dfe9f2',hemiG:'#a09080',mtn:'#c9bba9',road:'#6c6a6a',walk:'#d4cbbd',grd:'#bdb2a2',leaf:'#9aa77a',fog:'#efe8de',d:0},
  dusk:{top:'#3f3a6e',bot:'#f19a6c',hemiS:'#d39a85',hemiG:'#5a4a52',mtn:'#7d6878',road:'#4c4950',walk:'#8f7f7c',grd:'#857873',leaf:'#6a6a55',fog:'#d98c6d',d:.55},
};
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixHex=(a,b,t)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const mixPal=(a,b,t)=>{const o={};for(const k in a)o[k]=typeof a[k]==='number'?a[k]+(b[k]-a[k])*t:mixHex(a[k],b[k],t);return o};
function palette(m){
  const r=SUN.rise,s=SUN.set,K=[[r-80,'night'],[r-10,'dawn'],[r+70,'day'],[s-70,'day'],[s+5,'dusk'],[s+70,'night']];
  for(let i=0;i<K.length-1;i++){const [a,pa]=K[i],[b,pb]=K[i+1];if(m>=a&&m<b)return mixPal(PAL[pa],PAL[pb],(m-a)/(b-a))}
  return PAL.night;
}
let D=0;
function applyEnvironment(m){
  const P=palette(m);D=P.d;
  const k=wx.kind,grey=['cloudy','rain','storm','fog','snow'].includes(k)?.5:k==='partly'?.15:0;
  const night=P.d>.5;
  const gTop=night?'#1b1e2c':'#a3a8b0',gBot=night?'#262938':'#d6d4d0';
  const top=mixHex(P.top,gTop,grey),bot=mixHex(P.bot,gBot,grey);
  skyU.top.value.set(top);skyU.bot.value.set(bot);
  const fogC=mixHex(P.fog,gBot,grey);scene.fog.color.set(fogC);
  scene.fog.near=k==='fog'?6:k==='snow'?18:k==='rain'||k==='storm'?25:45;
  scene.fog.far=k==='fog'?55:k==='snow'?110:k==='rain'||k==='storm'?140:300;
  mtnMat.color.set(mixHex(P.mtn,bot,k==='fog'?.85:grey*.6));capMat.color.set(mixHex('#ffffff',bot,night?.55:grey*.4));
  hemi.color.set(P.hemiS);hemi.groundColor.set(P.hemiG);
  const wet=(k==='rain'||k==='storm')?.65:1;
  roadMat.color.set(mixHex(P.road,'#000000',1-wet));walkMat.color.set(k==='snow'?mixHex('#f4f6fa',P.walk,P.d*.5):mixHex(P.walk,'#000000',(1-wet)*.6));
  groundMat.color.set(k==='snow'?mixHex('#eef1f6',P.grd,P.d*.6):P.grd);leafMat.color.set(k==='snow'?mixHex('#e6ecf2',P.leaf,.4):P.leaf);
  dashMat.color.set(night?'#8a8a90':'#f2efe8');
  hemi.intensity=lerp(2.1,.55,P.d)*(1-grey*.35)+flashT*3;
  // sun / moon
  const dayF=(m-SUN.rise)/(SUN.set-SUN.rise),cp=camera.position;
  if(dayF>-.06&&dayF<1.06){const f=clamp(dayF,0,1);const dir=new THREE.Vector3((f-.5)*1.6,Math.sin(Math.PI*f)*.55+.04,-1).normalize();
    sunS.position.copy(cp).addScaledVector(dir,700);sunS.material.opacity=grey>.3?.25:1;sunS.visible=true;moonS.visible=false;
    sunL.position.copy(cp).addScaledVector(dir,50);sunL.color.set(f<.15||f>.85?'#ffc89a':'#fff1d6');sunL.intensity=(1.9*(1-grey*.6))*Math.min(1,Math.sin(Math.PI*f)*3+.15);}
  else{const nl=1440-(SUN.set-SUN.rise),nf=(((m-SUN.set)+1440)%1440)/nl;const dir=new THREE.Vector3((nf-.5)*1.6,Math.sin(Math.PI*nf)*.5+.06,-1).normalize();
    moonS.position.copy(cp).addScaledVector(dir,700);moonS.visible=true;moonS.material.opacity=grey>.3?.3:1;sunS.visible=false;
    sunL.position.copy(cp).addScaledVector(dir,50);sunL.color.set('#aebcff');sunL.intensity=.35*(1-grey*.6);}
  sunL.target.position.copy(cp);
  stars.material.opacity=(k==='clear'||k==='partly')?Math.max(0,P.d*1.15-.15):0;
  cloudMat.opacity={clear:.0,partly:.35,cloudy:.75,fog:.5,rain:.85,snow:.7,storm:.95}[k];
  cloudMat.color.set(night?'#3a4260':grey?'#d9dbe0':'#ffffff');
  // windows, lamps
  facadeMats.forEach(f=>f.emissiveIntensity=f.userData.always?Math.max(.35,P.d*.95):P.d*.85);
  lampGlows.forEach(g=>g.material.opacity=P.d*.9);lampPools.forEach(g=>g.material.opacity=P.d*.55);
  bulbMat.color.set(P.d>.3?'#ffe0a8':'#cfcac0');
  // shops open / closed
  PLACES.forEach(p=>{const r=shopRT[p.i];if(!r)return;const st=openState(p,m);
    r.light.intensity=st.open?lerp(14,26,P.d):.0;
    r.pend.forEach(b=>b.material.color.set(st.open?'#ffe1a8':'#5a5550'));
    r.signMat.color.setScalar(st.open?1:(P.d>.5?.35:.75));
    r.roomMat.color.set(st.open?p.inside:mixHex(p.inside,'#000000',P.d*.75));
  });
  return P;
}

const ZMAX=10,ZMIN=END-6;
let mode='walk',cur=null;
const cam={x:0,y:1.75,z:ZMAX,yaw:0,pitch:0};      // smoothed
const tgt={x:0,y:1.75,z:ZMAX,yaw:0,pitch:0};      // target
let look={x:0,y:0},drag=null,moved=0,vel=0;
const go=d=>{if(mode!=='walk')return;tgt.z=clamp(tgt.z-d,ZMIN,ZMAX)};
canvas.addEventListener('wheel',e=>{e.preventDefault();go((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*.018)},{passive:false});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,z:tgt.z,yaw:tgt.yaw,pitch:tgt.pitch};moved=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  look.x=e.clientX/innerWidth-.5;look.y=e.clientY/innerHeight-.5;
  if(!drag){hoverPick(e);return}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));
  if(mode==='walk'){const d=Math.abs(dx)>Math.abs(dy)?-dx:dy;tgt.z=clamp(drag.z+d*.045,ZMIN,ZMAX)}
  else if(mode==='inside'){tgt.yaw=drag.yaw+dx*.005;tgt.pitch=clamp(drag.pitch+dy*.003,-.5,.4)}
});
canvas.addEventListener('pointerup',e=>{const was=drag;drag=null;if(was&&moved<6)clickPick(e)});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(mode==='inside')toFocus();else if(mode==='focus')toWalk();return}
  if(e.target.tagName==='INPUT')return;
  if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(GAP)}
  if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-GAP)}
});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(clickables,false)[0];return h&&h.distance<60?PLACES[h.object.userData.place]:null}
function hoverPick(e){if(mode!=='walk'){canvas.classList.remove('hov');return}canvas.classList.toggle('hov',!!pick(e))}
function clickPick(e){if(mode!=='walk')return;const p=pick(e);if(p)focusPlace(p)}

function focusPlace(p){
  cur=p;mode='focus';
  const mob=innerWidth<=700;
  tgt.x=-p.s*1.6;tgt.y=mob?2.6:2.2;tgt.z=p.z+(mob?0:p.s*3.4);tgt.yaw=-p.s*Math.PI/2;tgt.pitch=mob?-.12:-.04;
  if(mob){tgt.x=-p.s*3.2;tgt.y=2.3;tgt.pitch=-.02}
  openPanel(p);
  $('#back').classList.remove('on');
}
function toWalk(){mode='walk';tgt.x=0;tgt.y=1.75;tgt.yaw=0;tgt.pitch=0;if(cur)tgt.z=cur.z+2;cur=null;closePanel();$('#back').classList.remove('on');$('#look').classList.remove('on')}
function goInside(){
  if(!cur)return;mode='inside';const p=cur;
  tgt.x=p.s*(FRONT+1.4);tgt.y=1.7;tgt.z=p.z;tgt.yaw=-p.s*Math.PI/2+(p.s>0?.35:-.35);tgt.pitch=-.05;
  closePanel();$('#back').classList.add('on');$('#look').classList.add('on');
}
function toFocus(){if(cur){const p=cur;$('#look').classList.remove('on');focusPlace(p)}}
$('#back').onclick=toFocus;

/* ================= HUD ================= */
let hudIdx=-2;
function updateHud(m){
  let best=null,bd=1e9;PLACES.forEach(p=>{const d=Math.abs(cam.z-p.z);if(d<bd){bd=d;best=p}});
  const p=(mode==='walk'&&bd>9)?null:(cur||best);
  const idx=p?p.i:-1;
  const st=p?openState(p,m):null;
  const statusTxt=p?(p.k==='ad'?'<i></i>свободно · нажми, чтобы узнать условия':st.open?`<i></i>${p.hours?'открыто до '+st.closes:'24/7'} · ${p.agent.toLowerCase()}`:`<i class="off"></i>закрыто до ${st.opens} · агент примет предзаказ`):
    `<i></i>${openNow(m)} · листай, чтобы идти`;
  if(idx!==hudIdx){
    hudIdx=idx;const box=$('#place');box.classList.add('swap');
    setTimeout(()=>{
      $('#plN').textContent=p?`${String(p.i+1).padStart(2,'0')} / ${String(PLACES.length).padStart(2,'0')} · ${p.line}`:'Бишкек · улица etb';
      $('#plT').textContent=p?p.name:'Иди по улице';
      $('#plS').innerHTML=statusTxt;box.classList.remove('swap');
    },380);
  }else $('#plS').innerHTML=statusTxt;
  $('#plR').textContent=`${Math.round((ZMAX-cam.z)/(ZMAX-ZMIN)*100)}% улицы`;
  $('#plBar').style.width=clamp((ZMAX-cam.z)/(ZMAX-ZMIN),0,1)*100+'%';
}
function openNow(m){const shops=PLACES.filter(p=>p.k!=='ad');const o=shops.filter(p=>openState(p,m).open).length;return `открыто ${o} из ${shops.length}`}

/* ================= panel ================= */
let orderNo=2050;
const panel=$('#panel');
function openPanel(p){
  document.body.classList.add('panel-open');panel.classList.add('on');panel.scrollTop=0;
  if(p.k==='ad')return adPanel(p);
  if(p.k==='office')return officePanel(p);
  if(p.k==='meet')return meetPanel(p);
  shopPanel(p);
}
function closePanel(){panel.classList.remove('on');document.body.classList.remove('panel-open')}
const X='<button class="x" id="px" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6"><path d="M2 2l10 10M12 2L2 12"/></svg></button>';
const bindX=()=>{$('#px').onclick=toWalk;const gi=$('#gi');gi&&(gi.onclick=goInside)};
const kick=(open,txt)=>`<div class="kick ${open?'':'off'}"><i></i>${txt}</div>`;
async function agentSay(box,text){
  const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';box.append(ty);panel.scrollTo({top:panel.scrollHeight,behavior:'smooth'});
  await sleep(1100);ty.remove();box.insertAdjacentHTML('beforeend',`<div class="b ai">${text}</div>`);panel.scrollTo({top:panel.scrollHeight,behavior:'smooth'});
}
function shopPanel(p){
  const st=openState(p,minutesNow());
  const q=p.menu.map(()=>0);let mode_=p.modes[0];
  panel.innerHTML=`${X}${kick(st.open,st.open?`открыто до ${st.closes}`:`закрыто · откроется в ${st.opens}`)}<h3>${p.name}</h3><div class="sub">${p.line}${st.open?'':' · агент примет предзаказ'}</div>
    <div class="row"><button class="pill" id="gi">Зайти внутрь →</button></div>
    <div class="seg">${p.modes.map(m=>`<button data-m="${m}" class="${m===mode_?'on':''}">${m}</button>`).join('')}</div><div id="sbody"></div>`;
  bindX();
  const body=$('#sbody');
  const total=()=>p.menu.reduce((s,[,pr],i)=>s+(pr||0)*q[i],0),count=()=>q.reduce((a,b)=>a+b,0);
  function render(){
    body.innerHTML=`<div class="menu">${p.menu.map(([n,pr],i)=>`<div class="it"><div class="ph" style="background:linear-gradient(${120+i*35}deg,${p.c[0]},${p.c[1]})"></div><div><b>${n}</b><small>${pr?fmt(pr)+' сом':'цену назовёт продавец'}</small></div><div class="qty"><button data-d="-1" data-i="${i}">−</button><span>${q[i]}</span><button data-d="1" data-i="${i}">+</button></div></div>`).join('')}</div>
      <div class="foot"><div class="tot">${count()?(total()?fmt(total())+' сом':count()+' шт'):'—'}</div><button class="pill solid" id="checkout" ${count()?'':'disabled style="opacity:.4"'}>${st.open?'Оформить':'Предзаказ'}</button></div><div class="msgs" id="amsg"></div>`;
    body.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;q[i]=Math.max(0,q[i]+ +b.dataset.d);render()});
    const co=$('#checkout');co&&(co.onclick=async()=>{
      co.disabled=true;co.style.opacity=.4;const no=++orderNo,box=$('#amsg');
      const what=p.menu.map(([n],i)=>q[i]?`${n} × ${q[i]}`:'').filter(Boolean).join(', ');
      box.innerHTML=`<div class="b mine">${what}, ${mode_.toLowerCase()}</div>`;
      const sum=total()?` — ${fmt(total())} сом`:', цену подтвержу в сообщении';
      let reply;
      if(!st.open)reply=`Мы закрыты, но заказ №${no} записал ✓${sum}. Откроемся в ${st.opens} — ваш будет первым.`;
      else if(mode_==='Доставка')reply=`Заказ №${no} принят ✓${sum}. Курьер будет примерно через 40 минут, оплата по QR.`;
      else if(mode_==='Бронь')reply=`Бронь №${no} ✓ Столик ждёт вас. Напомню за час.`;
      else reply=`Заказ №${no} принят ✓${sum}. Будет готов через 15 минут — назовите номер на кассе.`;
      await agentSay(box,reply);
    });
  }
  panel.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode_=b.dataset.m;panel.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
  render();
}
function adPanel(p){
  panel.innerHTML=`${X}${kick(true,'свободно')}<h3>${p.name}</h3><div class="sub">Реклама на улице: щиты, экраны, витрины. Видят все, кто идёт мимо.</div>
    <div class="seg"><button class="on">Щит</button><button>Экран</button><button>Витрина</button></div>
    <form class="form" id="adf"><input placeholder="Компания или Instagram" required><button class="pill solid">Узнать условия</button></form><div class="msgs" id="amsg"></div>`;
  bindX();
  panel.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>panel.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)));
  $('#adf').onsubmit=async e=>{e.preventDefault();e.target.querySelector('button').disabled=true;await agentSay($('#amsg'),'Принято ✓ Маркетолог пришлёт свободные даты, охват и цену в Telegram.')};
}
function officePanel(p){
  const m=minutesNow(),lines=[];
  PLACES.filter(x=>x.k==='shop').forEach((x,i)=>{const s=openState(x,m);lines.push([`Продавец · ${x.name}`,s.open?`принял заказ №${2040+i}`:`записал предзаказ на ${s.opens}`])});
  lines.push(['Маркетолог','ответил на заявку на рекламное место'],['Координатор','сводка по улице готова'],['Протоколист','итоги встречи отправлены обеим сторонам']);
  panel.innerHTML=`${X}${kick(true,'24/7')}<h3>etb.ai</h3><div class="sub">Офис агентов. Работают во всех заведениях улицы, даже когда те закрыты.</div><div class="row"><button class="pill" id="gi">Зайти внутрь →</button></div><div class="feed" id="feed"></div>`;
  bindX();
  (async()=>{for(const [i,[w,t]] of lines.entries()){if(!panel.classList.contains('on')||!$('#feed'))return;$('#feed').insertAdjacentHTML('beforeend',`<div class="fi"><div><b>${w}</b><span>${t}</span></div><time>${hhmm(m-i*3)}</time></div>`);await sleep(320)}})();
}
function meetPanel(p){
  panel.innerHTML=`${X}${kick(true,'24/7')}<h3>Переговорная</h3><div class="sub">Личная ссылка на видеовстречу. ИИ ведёт протокол, итоги приходят обеим сторонам.</div>
    <div class="row"><button class="pill" id="gi">Зайти внутрь →</button></div>
    <form class="form" id="mf"><input id="pname" placeholder="Имя партнёра" autocomplete="off" required><button class="pill solid">Создать ссылку</button></form><div class="msgs" id="amsg"></div>`;
  bindX();
  const slug=s=>{const t={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sh',ы:'y',э:'e',ю:'yu',я:'ya',ү:'u',ө:'o',ң:'n'};return s.toLowerCase().split('').map(c=>t[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'partner'};
  $('#mf').onsubmit=async e=>{e.preventDefault();const n=$('#pname').value.trim();const url='etb.world/meet/'+slug(n)+'-'+Math.random().toString(36).slice(2,6);
    navigator.clipboard?.writeText('https://'+url).catch(()=>{});
    await agentSay($('#amsg'),`Ссылка для ${n} готова и скопирована: <b>${url}</b>. Протоколист подключится к встрече.`)};
}

/* ================= chips ================= */
$('#clk').onclick=()=>{
  if(lapse){cancelAnimationFrame(lapse.raf);lapse=null;simOffset=0;return}
  const start=performance.now(),dur=60000;lapse={};
  const step=t=>{const k=(t-start)/dur;if(k>=1){lapse=null;simOffset=0;return}simOffset=k*86400000;lapse.raf=requestAnimationFrame(step)};
  lapse.raf=requestAnimationFrame(step);
};
$('#wx').onclick=()=>{wx={...wx,kind:ORDER[(ORDER.indexOf(wx.kind)+1)%ORDER.length],real:false}};

/* ================= boot ================= */
await Promise.race([Promise.all([document.fonts.load('600 80px Unbounded','KAZAN ПЕРЕГОВОРНАЯ СУПАРА ТАЛКАН ЛУНА КОФЕ РЕКЛАМНОЕ МЕСТО ЭКРАН'),document.fonts.load('400 30px Onest','ваш ролик щит экран')]),sleep(2500)]);
PLACES.forEach(p=>p.k==='ad'?billboard(p):shopBuilding(p));
loadWeather();setInterval(loadWeather,10*60*1000);
window.__w={get mode(){return mode},tgt,PLACES,focusPlace,goInside,toWalk,setWx:k=>wx={...wx,kind:k,real:false},setT:h=>simOffset=h,get wx(){return wx}};

let last=performance.now(),frame=0;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;frame++;
  const m=minutesNow();
  const P=applyEnvironment(m);
  // camera smoothing
  const k=mode==='walk'?.075:.045;
  const pz=cam.z;
  for(const key of ['x','y','z','yaw','pitch'])cam[key]=lerp(cam[key],tgt[key],k);
  vel=cam.z-pz;
  const bob=mode==='walk'?Math.sin(t*.012)*Math.min(.05,Math.abs(vel)*.6):0;
  camera.position.set(cam.x,cam.y+bob,cam.z);
  const ly=mode==='walk'&&!drag?-look.x*.22:0,lp=mode==='walk'&&!drag?-look.y*.1:0;
  camera.rotation.set(cam.pitch+lp,cam.yaw+ly,0);
  // glass fades when inside
  PLACES.forEach(p=>{const r=shopRT[p.i];if(r)r.glassMat.opacity=(mode==='inside'&&cur===p)?0:.22*(1-P.d*.6)});
  // sky follows camera
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  clouds.forEach(c=>{c.userData.a+=c.userData.v*dt*1000;c.position.set(camera.position.x+Math.cos(c.userData.a)*c.userData.r,c.userData.y,camera.position.z+Math.sin(c.userData.a)*c.userData.r)});
  mtns.position.z=camera.position.z*.25;
  updatePrecip(dt,t);
  if(frame%3===0)drawScreen(t);
  // HUD
  $('#clkTx').textContent=hhmm(m)+(lapse?' · сутки за минуту':'');$('#clk').classList.toggle('lapse',!!lapse);
  $('#wxIc').textContent=WX[wx.kind][P.d>.5?2:1];
  $('#wxTx').textContent=`Бишкек${wx.temp!=null?' · '+(wx.temp>0?'+':'')+wx.temp+'°':''} · ${WX[wx.kind][0]}`;
  if(frame%6===0)updateHud(m);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(()=>$('#loading').classList.add('off'),300);
</script>
</body>
</html>
